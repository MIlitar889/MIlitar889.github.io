<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1A1A1A">
<title>Menú</title>
<style>
:root{--rojo:#C8372D;--dorado:#B8972A;--fondo:#EDE8E0;--negro:#1A1A1A;--borde:#DDD6CA;--gris:#6B7280;--tarj:#F4F0E9}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--fondo);color:var(--negro);line-height:1.4;padding-bottom:150px}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--dorado);outline-offset:2px}
.w{max-width:560px;margin:0 auto;padding:0 16px}
h1,h2,h3{margin:0;font-weight:400}
/* hero */
.hero{background:#111 center/cover;color:#fff;border-radius:0 0 34px 34px;padding:70px 0 22px;position:relative;overflow:hidden;min-height:330px;display:flex;align-items:flex-end}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.82),rgba(0,0,0,.25) 70%,rgba(0,0,0,.55))}
.hero .w{position:relative;width:100%}
.hero h1{font-size:2.1rem;letter-spacing:.02em}.hero p{margin:6px 0 14px;opacity:.9;font-size:.92rem}
.logo-top{position:absolute;top:16px;left:0;right:0;text-align:center;z-index:1;font-weight:800;letter-spacing:.12em;font-size:.8rem}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:12px;padding:12px 20px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;font-size:.88rem}
.rojo{background:var(--rojo);color:#fff}.suave{background:rgba(255,255,255,.18);color:#fff}.rosa{background:#E8A39E;color:#fff}
.busca{display:flex;gap:10px;margin-top:16px}.busca input{flex:1;border:0;border-radius:99px;padding:14px 18px;font:inherit}
.pin{width:50px;height:50px;border-radius:50%;background:#fff;color:var(--negro);font-size:1.2rem}
/* categorías */
.tabs{display:flex;gap:6px;overflow-x:auto;margin:0 -16px;padding:14px 16px 0;border-bottom:3px solid #D6D0C6;scrollbar-width:none}
.tab{white-space:nowrap;padding:10px 16px;color:var(--gris);border-radius:99px 99px 0 0;border:2px solid transparent}
.tab[aria-selected="true"]{border-color:#9AA1AD;border-radius:99px;color:var(--negro);margin-bottom:6px}
/* lista y cuadrícula */
.fila{display:flex;gap:14px;padding:16px 0;text-align:left;width:100%;align-items:flex-start}
.fila h3{font-size:1.35rem;letter-spacing:.02em}.fila p{margin:4px 0 6px;color:var(--gris);font-size:.88rem}
.precio{color:var(--rojo);font-size:1.15rem}
.foto{width:100px;height:120px;border-radius:16px;object-fit:cover;background:#D9D2C5;flex-shrink:0;display:grid;place-items:center;font-size:2rem}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.card{background:var(--tarj);border-radius:16px;overflow:hidden;text-align:left;position:relative}
.card img,.card .foto{width:100%;height:112px;border-radius:0}
.card .t{padding:8px 10px 10px}.card b{display:block;font-weight:400;font-size:.9rem;min-height:2.5em}
.mas{position:absolute;right:8px;bottom:8px;width:32px;height:32px;border-radius:50%;background:var(--rojo);color:#fff;font-size:1.2rem;line-height:1}
.q{display:flex;gap:8px;margin:14px 0}
/* tarjetas */
.caja{background:var(--tarj);border-radius:18px;padding:16px;margin:12px 0}
.caja h2{font-size:1.1rem;font-weight:700;margin-bottom:8px}
.nota{color:var(--gris);font-size:.85rem}
label{display:block;font-size:.78rem;font-weight:700;color:var(--gris);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.03em}
.campo{width:100%;padding:12px;border-radius:12px;border:1px solid var(--borde);font:inherit;background:#fff}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{padding:9px 14px;border-radius:99px;background:#fff;border:1px solid var(--borde);font-weight:700;font-size:.88rem}
.chip[aria-pressed="true"]{background:var(--rojo);color:#fff;border-color:var(--rojo)}
.cant{display:flex;align-items:center;gap:10px}.cant button{width:36px;height:36px;border-radius:50%;background:#fff;border:1px solid var(--borde);font-weight:800}
/* barra inferior */
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--fondo);border-radius:26px 26px 0 0;box-shadow:0 -4px 20px rgba(0,0,0,.08);display:flex;justify-content:space-around;padding:10px 8px calc(10px + env(safe-area-inset-bottom));z-index:20;max-width:560px;margin:0 auto}
.nav button{display:grid;justify-items:center;gap:2px;padding:8px 18px;border-radius:18px;color:var(--gris);font-size:.78rem}.nav b{font-size:1.4rem;font-weight:400}
.nav button[aria-current="page"]{background:var(--rojo);color:#fff}
.carro{position:fixed;left:12px;right:12px;bottom:calc(86px + env(safe-area-inset-bottom));max-width:536px;margin:0 auto;z-index:19}
.carro button{width:100%;display:flex;justify-content:space-between;background:var(--negro);color:#fff;border-radius:16px;padding:15px 18px;font-weight:800}
/* hoja de producto / ventanas */
.vel{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;display:flex;align-items:flex-end}
.hoja{background:var(--fondo);width:100%;max-width:560px;margin:0 auto;border-radius:24px 24px 0 0;max-height:92vh;overflow-y:auto;padding:0 0 20px}
.hoja img.gr{width:100%;height:220px;object-fit:cover}
.hoja .in{padding:0 18px}
fieldset{border:1px solid var(--borde);border-radius:14px;margin:12px 0;padding:6px 12px}legend{font-weight:800;padding:0 6px}
.op{display:flex;gap:10px;align-items:center;padding:8px 0}
.grande{display:flex;justify-content:center;width:100%;background:var(--rojo);color:#fff;border-radius:16px;padding:16px;font-weight:800;margin-top:14px}.grande:disabled{opacity:.4}
.atras{background:#1A1A1A;color:#fff;border-radius:12px;padding:10px 16px;font-weight:700}
/* lealtad */
.tarj{border-radius:26px;padding:16px;color:var(--t);background:var(--f) center/cover;position:relative;overflow:hidden}
.tarj::before{content:"";position:absolute;inset:0;background:rgba(0,0,0,.45)}.tarj>*{position:relative}
.sellos{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;justify-items:center;margin:14px 0}
.sello{width:56px;height:56px;border-radius:50%;border:2px dashed rgba(255,255,255,.55);display:grid;place-items:center;color:rgba(255,255,255,.7);font-size:1.1rem}
.sello.on{background:var(--a);border:0;color:#111}.sello img{width:32px;height:32px;border-radius:50%;object-fit:cover}
.prog{height:10px;background:rgba(255,255,255,.2);border-radius:99px;overflow:hidden;flex:1}.prog i{display:block;height:100%;background:var(--rojo)}
.cod{background:#fff;border-radius:18px;padding:14px;text-align:center;margin-top:12px;color:#111}.cod svg{width:100%;height:70px}.cod code{letter-spacing:.2em;font-weight:700}
.oscuro{background:#1A1A1A;color:#fff;border-radius:18px;padding:16px;margin:12px 0}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:12px}
/* seguimiento */
.estado{border-radius:22px;padding:20px;color:#fff;display:flex;justify-content:space-between;align-items:center;gap:10px}
.estado b{font-size:1.6rem}.pasos{display:flex;background:var(--tarj);border-radius:18px;padding:16px 6px;margin:12px 0}
.p{flex:1;text-align:center;position:relative;font-size:.7rem;color:var(--gris)}.p span{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:#fff;border:2px solid #D1D5DB;position:relative;z-index:1}
.p::before{content:"";position:absolute;top:16px;left:-50%;width:100%;height:3px;background:#D1D5DB}.p:first-child::before{display:none}
.p.h::before{background:#4CAF6A}.p.h span,.p.a span{background:#4CAF6A;border-color:#4CAF6A;color:#fff}.p.a{color:var(--negro);font-weight:700}
.codigo{background:#1A1A1A;color:#fff;border-radius:18px;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;border:2px solid var(--rojo)}
.codigo b{font-size:2rem;letter-spacing:.04em}.verde{background:#4CD16B;color:#fff;border-radius:14px;padding:10px 16px;font-weight:700}
.pie{background:#1E1A19;color:#fff;margin-top:30px;padding:26px 0;text-align:center}.pie h2{font-weight:300;letter-spacing:.06em}
.redes{display:flex;gap:10px;justify-content:center;margin-top:12px;flex-wrap:wrap}.redes a{padding:10px 16px;border:1px solid #444;border-radius:14px;color:#fff;text-decoration:none;font-size:.85rem}
#impr{display:none}
@media print{body>*:not(#impr){display:none!important}#impr{display:block;padding:20px;font-family:Georgia,serif}#impr h1{text-align:center}#impr h2{border-bottom:1px solid #999;margin:18px 0 6px}#impr p{margin:4px 0;display:flex;justify-content:space-between;gap:20px}}
</style>
</head>

/* ---------- código de barras (Code 128-B) ---------- */
function barras(txt){
  const v=[104];for(const ch of txt)v.push(ch.charCodeAt(0)-32);
  let s=104;for(let i=1;i<v.length;i++)s+=v[i]*i;v.push(s%103);
  const bits=v.map(x=>C128[x]).join("")+"1100011101011";
  let x=0,r="";while(x<bits.length){if(bits[x]==="1"){let n=x;while(bits[n]==="1")n++;r+=`<rect x="${x+10}" y="0" width="${n-x}" height="40"/>`;x=n;}else x++;}
  return `<svg viewBox="0 0 ${bits.length+20} 40" preserveAspectRatio="none" role="img" aria-label="Código de barras ${esc(txt)}" fill="#111">${r}</svg>`;
}

function registrarCuenta(f){

  }else{
    const N=D.neg,num=dig(N.tel);
    const texto=`Hola, quiero hacer un pedido en ${N.n||"el restaurante"}:\n\n`+S.carro.map(i=>`• ${i.q} x ${i.n}${[(i.opc||[]).join(", "),i.nota].filter(Boolean).length?" ("+[(i.opc||[]).join(", "),i.nota].filter(Boolean).join(" · ")+")":""} — ${$m(i.c*i.q)}`).join("\n")+`\n\nTotal: ${$m(total())}\nNombre: ${f.nombre.trim()}\nTeléfono: ${tel}\n`+(mesa?`Mesa: ${mesa}\n`:`Tipo: ${f.tipo==="domicilio"?"A domicilio":"Paso a recoger"}\n`)+(f.tipo==="domicilio"?`Dirección: ${f.dir.trim()}\n`:"")+(f.nota.trim()?`Nota: ${f.nota.trim()}\n`:"");
    S.carro=[];S.tab="inicio";
    if(num)window.open("https://wa.me/"+(num.length===10?"52"+num:num)+"?text="+encodeURIComponent(texto),"_blank");else alert("Aún no hay WhatsApp configurado. Muestra este pedido en el local:\n\n"+texto);
  }
}
function pitar(){try{const c=new(window.AudioContext||window.webkitAudioContext)(),g=c.createGain();g.connect(c.destination);[880,1175].forEach((f,i)=>{const o=c.createOscillator(),t=c.currentTime+i*.2;o.frequency.value=f;o.connect(g);g.gain.setValueAtTime(.3,t);o.start(t);o.stop(t+.15);});}catch(e){}}

document.addEventListener("click",e=>{
  if(e.target.closest("[data-stop]")&&!e.target.closest("[data-act]"))return;
  const b=e.target.closest("[data-act]");if(!b||!acc[b.dataset.act])return;
  if(b.dataset.act==="cerrar"&&b.classList.contains("vel")&&e.target.closest(".hoja")&&e.target.closest(".hoja")!==null&&!e.target.closest("[data-act='cerrar'].chip"))return;
  acc[b.dataset.act](b,datos());render();
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.id==="q"){S.q=t.value;render();}
  else if(t.dataset.ni!==undefined){S.carro[+t.dataset.ni].nota=t.value;}
  else if(t.dataset.f){S.f[t.dataset.f]=t.value;}
  else if(t.dataset.r){S.reg[t.dataset.r]=t.value;}
  else if(t.dataset.e){S.ent[t.dataset.e]=t.value;}
  else if(t.dataset.s){S.segq[t.dataset.s]=t.value;}
  else if(t.dataset.pn){S.nota=t.value;}
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.g){S.sel[t.dataset.g]=t.value===""?null:+t.value;render();}
  else if(t.dataset.fc){S.f.cuenta=t.checked;}
});
// Tiempo real: revisa el panel cada 2 s y avisa si cambió el estado del pedido que sigues
setInterval(()=>{
  if(NUBE){if(S.tab==="seg"&&S.seg&&++segTick%2===0)refrescarSeg();return;}
  const antes=rawCache;panel();
  if(S.tab==="seg"){const o=pedidoSeg(),k=o?o.estado+"|"+o.tiempoEst:null;if(k!==ultimoEstado){if(ultimoEstado!==null&&S.snd)pitar();ultimoEstado=k;render();}else if(o)render();}
  else if(rawCache!==antes&&!S.prod&&S.tab!=="carro"&&!document.activeElement.matches("input,textarea"))render();
},2000);
window.addEventListener("storage",e=>{if(e.key===KEY&&!S.prod&&!(document.activeElement&&document.activeElement.matches("input,textarea")))render();});
render();
</script>
