<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Panel | Sushi Pu'uk</title>
<style>
/* Variables de color y estilos generales */
/* ==========================================================
   1. VARIABLES (colores y medidas tomadas del diseño original)
   ========================================================== */
:root {
  --rojo: #C8372D;
  --dorado: #B8972A;
  --verde: #2D5F4F;
  --turquesa: #4ECDC4;
  --negro: #1A1A1A;
  --fondo: #F7F7F5;
  --tarjeta: #FFFFFF;
  --borde: #ECECE8;
  --texto: #1F2937;
  --texto-suave: #6B7280;
  --radio: 16px;
  --sombra: 0 4px 14px rgba(0, 0, 0, .06);
  --ancho-menu: 240px;
}

/* ==========================================================
   2. BASE
   ========================================================== */
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  background: var(--fondo);
  color: var(--texto);
  line-height: 1.5;
}
button { font: inherit; cursor: pointer; border: 0; background: none; color: inherit; }
button:focus-visible { outline: 3px solid var(--dorado); outline-offset: 2px; }
h1, h2, p { margin: 0; }

/* Estructura: menú lateral y área de contenido */
/* ==========================================================
   3. ESTRUCTURA: menú lateral + contenido
   ========================================================== */
.app { display: flex; min-height: 100vh; }

.menu {
  width: var(--ancho-menu);
  flex-shrink: 0;
  background: var(--negro);
  color: #fff;
  display: flex;
  flex-direction: column;
  padding: 20px 12px;
  position: sticky;
  top: 0;
  height: 100vh;
}
.menu__marca { text-align: center; padding-bottom: 18px; margin-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,.08); }
.menu__marca strong { display: block; color: var(--rojo); font-size: 1.1rem; letter-spacing: .06em; }
.menu__marca span { font-size: .72rem; opacity: .5; }
.menu__lista { display: flex; flex-direction: column; gap: 2px; overflow-y: auto; flex: 1; }
.menu__pie { border-top: 1px solid rgba(255,255,255,.08); padding-top: 8px; display: flex; flex-direction: column; gap: 2px; }

.menu__item {
  display: flex; align-items: center; gap: 12px;
  padding: 9px 12px; border-radius: 10px;
  font-weight: 700; font-size: .9rem; text-align: left; width: 100%;
  transition: background .15s;
}
.menu__item:hover { background: rgba(255,255,255,.1); }
.menu__item[aria-current="page"] { background: var(--rojo); }
.menu__item svg { width: 18px; height: 18px; flex-shrink: 0; }

.contenido { flex: 1; min-width: 0; padding: 32px; max-width: 1240px; margin: 0 auto; }
.boton-menu { display: none; }

/* Encabezados, filtros, indicadores (KPI) y gráficas */
/* ==========================================================
   4. ENCABEZADO Y FILTRO DE PERIODO
   ========================================================== */
.encabezado { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 16px; margin-bottom: 24px; }
.encabezado h1 {
  font-size: 1.9rem; font-weight: 800;
  background: linear-gradient(90deg, var(--rojo), var(--dorado));
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.encabezado p { color: var(--texto-suave); font-size: .9rem; }

.boton-exportar {
  background: #22C55E; color: #fff; font-weight: 700; font-size: .88rem;
  padding: 10px 16px; border-radius: 10px;
}
.boton-exportar:hover { background: #16A34A; }
.boton-exportar:disabled { opacity: .4; cursor: not-allowed; }

.tarjeta { background: var(--tarjeta); border: 1px solid var(--borde); border-radius: var(--radio); box-shadow: var(--sombra); padding: 20px; }
.tarjeta h2 { font-size: 1.05rem; font-weight: 700; margin-bottom: 14px; }
.periodo { margin-bottom: 20px; }
.periodo__titulo { font-weight: 700; }
.periodo__ayuda { font-size: .78rem; color: var(--texto-suave); margin-bottom: 12px; }
.periodo__botones { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  padding: 8px 16px; border-radius: 12px; font-weight: 700; font-size: .85rem;
  border: 1px solid var(--borde); background: #fff; color: #374151;
}
.chip:hover { border-color: var(--rojo); }
.chip[aria-pressed="true"] { background: var(--rojo); border-color: var(--rojo); color: #fff; }

/* ==========================================================
   5. INDICADORES (KPI)
   ========================================================== */
.indicadores { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 16px; margin-bottom: 20px; }
.indicador__etiqueta { font-size: .78rem; color: var(--texto-suave); margin-bottom: 4px; }
.indicador__valor { font-size: 1.9rem; font-weight: 800; }
.indicador { border-top: 4px solid var(--color); }

/* ==========================================================
   6. GRÁFICAS
   ========================================================== */
.graficas { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 20px; margin-bottom: 20px; }
.grafica svg { width: 100%; height: auto; display: block; }
.vacio { color: var(--texto-suave); font-size: .9rem; padding: 40px 0; text-align: center; }

.leyenda { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 6px; font-size: .88rem; }
.leyenda li { display: flex; align-items: center; gap: 8px; }
.leyenda i { width: 12px; height: 12px; border-radius: 4px; background: var(--color); flex-shrink: 0; }
.leyenda b { margin-left: auto; }

.barras { display: grid; gap: 12px; }
.barra__fila { display: grid; grid-template-columns: 130px 1fr 40px; align-items: center; gap: 12px; font-size: .88rem; }
.barra__pista { background: #F1F1EE; border-radius: 8px; height: 22px; overflow: hidden; }
.barra__relleno { height: 100%; background: var(--rojo); border-radius: 8px; transition: width .3s; }

/* Estilos de las pantallas: venta, menú, lealtad, avisos */
[hidden]{display:none!important}
.sub{font-size:1.2rem;margin:0 0 14px}
.lista{display:grid;gap:10px}
.fila{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 16px}
.fila--btn{width:100%;text-align:left}.fila--btn:hover{border-color:var(--rojo)}
.avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--rojo),var(--dorado));color:#fff;display:grid;place-items:center;font-weight:800;flex-shrink:0}
.badge{display:inline-block;background:#F1F1EE;border-radius:8px;padding:2px 8px;font-size:.75rem;font-weight:700;margin:2px}
.badge.ok{background:#DCFCE7;color:#166534}.badge.mal{background:#FEE2E2;color:#991B1B}
.nota{color:var(--texto-suave);font-size:.85rem;margin:8px 0}
.campo{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--borde);border-radius:10px;background:#fff;margin-bottom:10px}
.campo:focus{outline:3px solid var(--dorado);outline-offset:1px}
label{font-size:.8rem;font-weight:700;color:var(--texto-suave);display:block;margin:6px 0 4px}
.dos{display:grid;grid-template-columns:1fr 340px;gap:20px;align-items:start}
.caja{grid-template-columns:1fr 390px}
.prodgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.pbtn{text-align:center;display:grid;gap:4px;justify-items:center;padding:12px}.pbtn:hover{border-color:var(--rojo)}
.pbtn img,.noimg{width:68px;height:68px;border-radius:12px;object-fit:cover;background:#F1F1EE;display:grid;place-items:center;font-size:1.6rem}
.qrgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px}
.qr{margin:0;text-align:center}.qr img{width:100%;max-width:170px}
.btn-verde{background:var(--verde);color:#fff;font-weight:700;padding:10px 16px;border-radius:10px}
.btn-rojo{background:var(--rojo);color:#fff;font-weight:700;padding:10px 16px;border-radius:10px}
.btn-rojo:disabled{opacity:.4;cursor:not-allowed}
.tipos{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.tipo{border:2px solid var(--borde);border-radius:14px;padding:14px;text-align:left;background:#fff}
.tipo[aria-pressed="true"]{border-color:var(--rojo);background:#FEF4F3}
.menu-ed{display:grid;grid-template-columns:1fr 320px;gap:20px;align-items:start}
.cat{margin-bottom:14px;padding:0}.cat__cab{display:flex;gap:12px;align-items:center;padding:14px 16px}
.emo{width:48px;height:48px;border-radius:12px;background:#F4F4F1;font-size:1.4rem}
.ico{width:34px;height:34px;border-radius:8px;color:#9CA3AF}.ico:hover{background:#F4F4F1}
.prod2{display:grid;grid-template-columns:70px 1fr 120px;gap:14px;padding:14px 16px;border-top:1px solid var(--borde);align-items:start}
.prod2.sobre{background:#FEF9EC;outline:2px dashed var(--dorado)}
.prod2 img,.prod2 .noimg{width:64px;height:64px;border-radius:12px;object-fit:cover;background:#F1F1EE;display:grid;place-items:center}
.pprecio{display:grid;gap:10px;justify-items:end}.pprecio .campo{margin:0;text-align:center}
.pill{display:inline-flex;gap:4px;align-items:center;border:1px dashed #CBD5E1;border-radius:99px;padding:2px 10px;font-size:.75rem;font-weight:700;margin:2px;background:#fff;font-family:inherit}
.pill button{color:#9CA3AF}
.sw{position:relative;width:44px;height:24px;display:inline-block}.sw input{opacity:0;position:absolute;inset:0;cursor:pointer;z-index:1;margin:0}
.sw i{position:absolute;inset:0;background:#D1D5DB;border-radius:99px;transition:.2s}
.sw i::after{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.sw input:checked+i{background:#16A34A}.sw input:checked+i::after{transform:translateX(20px)}
.mod{border:1px solid var(--borde);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:#fff;cursor:grab}
.mod summary{cursor:pointer;font-weight:700;font-size:.9rem;display:flex;justify-content:space-between;gap:8px}
.cnt{font-size:.75rem;color:var(--texto-suave)}
.cab-lealtad{background:linear-gradient(90deg,var(--rojo),var(--dorado));color:#fff;border-radius:var(--radio);padding:20px 24px;margin-bottom:16px}
.cab-lealtad h1{margin:0;font-size:1.6rem}.cab-lealtad p{opacity:.9}
.acord{margin-bottom:10px}.acord summary{cursor:pointer;font-weight:700}
.tel{width:300px;border:10px solid #111;border-radius:38px;background:#EFE9E0;padding:14px;margin:0 auto}
.tarj{border-radius:22px;padding:16px;color:var(--t);background:var(--f) center/cover;position:relative;overflow:hidden}
.tarj>*{position:relative}.tarj::before{content:"";position:absolute;inset:0;background:rgba(0,0,0,.35)}
.tarj .logo{width:46px;height:46px;border-radius:8px;object-fit:cover}
.sellos{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;justify-items:center;margin:12px 0}
.sello{width:44px;height:44px;border-radius:50%;border:2px dashed rgba(255,255,255,.5);display:grid;place-items:center;font-size:1.2rem;color:rgba(255,255,255,.6)}
.sello.on{background:var(--a);border:0;color:#111}.sello img{width:26px;height:26px;object-fit:cover;border-radius:50%}
.prog{height:8px;background:rgba(255,255,255,.2);border-radius:99px;overflow:hidden}.prog i{display:block;height:100%;background:var(--rojo)}
.cuenta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
#toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,20px);background:var(--negro);color:#fff;padding:12px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:.2s;z-index:100;max-width:90vw;font-size:.9rem}
#toast.on{opacity:1;transform:translate(-50%,0)}
dialog{border:0;border-radius:var(--radio);padding:20px;max-width:380px}
dialog pre{font-size:.8rem;margin:0 0 12px;white-space:pre-wrap}
@media(max-width:1000px){.dos,.caja,.menu-ed{grid-template-columns:1fr}.prod2{grid-template-columns:60px 1fr}.pprecio{grid-column:1/-1;grid-auto-flow:column;justify-content:start}}
@media print{.menu,.boton-menu,.encabezado,#toast{display:none!important}.contenido{padding:0}section[data-vista]:not(#v-mesas){display:none!important}.qr{break-inside:avoid}}

a.boton-exportar{display:inline-block;text-decoration:none}

/* ---- Pantalla de cocina (tablet) ---- */
body.modo-cocina{background:#111}
body.modo-cocina .menu,body.modo-cocina .boton-menu{display:none}
body.modo-cocina .contenido{max-width:none;padding:14px;margin:0}
.kocina{color:#fff}
.khead{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px}
.khead h1{font-size:1.8rem;margin:0}
.kbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.kchip{padding:12px 18px;min-height:48px;border-radius:14px;background:#262626;color:#fff;font-weight:700;font-size:1rem;text-decoration:none;display:inline-flex;align-items:center}
.kchip[aria-pressed="true"]{background:var(--rojo)}
.kreloj{font-size:1.6rem;font-weight:800;margin-right:8px}
.kcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px;align-items:start}
.kcol h2{font-size:1.3rem;margin:0 0 10px;color:#fff}
.kcard{background:#1E1E1E;border-radius:16px;padding:14px;margin-bottom:12px;border-left:8px solid #22C55E}
.kcard.warn{border-color:#F59E0B}.kcard.late{border-color:#EF4444;animation:pulso 1.2s infinite}
.kcard header{display:flex;gap:10px;align-items:center;font-size:1.1rem}.kt{margin-left:auto;font-weight:800}
.kcard ul{list-style:none;margin:10px 0;padding:0;font-size:1.35rem;line-height:1.5}
.knota{background:#7C2D12;border-radius:8px;padding:8px;font-size:1.05rem;margin:0 0 10px}
.kcard footer{display:flex;gap:8px}
.kb{flex:1;min-height:60px;border-radius:14px;background:var(--verde);color:#fff;font-size:1.2rem;font-weight:800}
.kb--gris{flex:0 0 64px;background:#3F3F46}
.kvacio,.kpie{color:#9CA3AF;text-align:center;padding:16px}
@keyframes pulso{50%{box-shadow:0 0 0 3px rgba(239,68,68,.5)}}

/* ---- Notas por producto, cancelación y chat ---- */
.kinota{background:#F59E0B;color:#111;border-radius:8px;padding:1px 8px;font-weight:800}
.kcard footer{display:grid;gap:8px}.kfila{display:flex;gap:8px}
.kb--chico{min-height:48px;font-size:1rem;background:#3F3F46}.kb--rojo{background:#B91C1C}
.kchat{background:#1E1E1E;border-radius:16px;padding:12px;margin-bottom:14px}
.chat-msgs{max-height:260px;overflow-y:auto;display:grid;gap:8px;padding:4px;margin-bottom:10px}
.burbuja{background:#EDEDE9;border-radius:14px;padding:8px 12px;max-width:80%;justify-self:start}.burbuja p{margin:2px 0 0}
.burbuja.mia{background:#CFE8DC;justify-self:end}.burbuja small{color:var(--texto-suave)}
.chat-sis{text-align:center;background:#FEF3C7;color:#78350F;border-radius:10px;padding:6px 10px;margin:0;font-weight:700}
.chat-in{display:flex;gap:8px}.chat-in .campo{margin:0;flex:1}
.kocina .burbuja{background:#2B2B2B;color:#fff}.kocina .burbuja.mia{background:#14532D}.kocina .burbuja small{color:#9CA3AF}
.kocina .chat-in .campo{background:#111;color:#fff;border-color:#3F3F46;font-size:1.1rem}
.bd{background:var(--rojo);color:#fff;border-radius:99px;padding:0 8px;font-size:.75rem;margin-left:auto}.bd:empty{display:none}
#dlg-can{max-width:420px;width:92vw}

.foto-cambio{position:relative;cursor:pointer;display:block;width:64px;height:64px}
.foto-cambio span{position:absolute;right:-4px;bottom:-4px;background:#fff;border-radius:99px;font-size:.8rem;padding:1px 4px;box-shadow:0 1px 4px rgba(0,0,0,.3)}

/* ---- Panel de meseros (celular) ---- */
body.modo-mesero{background:#F4F1EC}
body.modo-mesero .menu,body.modo-mesero .boton-menu{display:none}
body.modo-mesero .contenido{max-width:560px;padding:12px 12px 110px;margin:0 auto}
.mz-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.mz-btn{display:block;width:100%;min-height:56px;border-radius:14px;font-size:1.1rem;font-weight:800;color:#fff}
.mz-btn.btn-rojo,.mz-btn.btn-verde{padding:0 16px}
.mz-mesa{display:block;width:100%;text-align:left;margin-bottom:10px;padding:14px}
.mz-barra{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--borde);padding:10px 12px calc(10px + env(safe-area-inset-bottom));z-index:30;max-width:560px;margin:0 auto}
.cats{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}.cats .chip{white-space:nowrap}
.pick__fila{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--borde)}
/* Rondas en la cocina */
.kextra{background:#1D4ED8;color:#fff;border-radius:8px;padding:8px 10px;font-weight:800;margin:8px 0}
.kprev{color:#9CA3AF;font-size:.95rem;margin:4px 0}.kmeta{color:#9CA3AF;margin:4px 0}
.kcanc{color:#F87171}.kcanc s{opacity:.7}
/* Comanda impresa (80 mm) */
#print-area{display:none}
@page ticket{size:80mm auto;margin:3mm}
@media print{body.imprimiendo>*:not(#print-area){display:none!important}body.imprimiendo #print-area{display:block;page:ticket;font-family:monospace}#print-area pre{font-size:12px;white-space:pre-wrap;margin:0 0 6px;page-break-after:always}}

/* ---- App del dueño (celular) ---- */
body.modo-dueno{background:#F4F1EC}
body.modo-dueno .menu,body.modo-dueno .boton-menu{display:none}
body.modo-dueno .contenido{max-width:560px;padding:12px 12px 90px;margin:0 auto}
.dn-top{display:grid;gap:2px;margin-bottom:12px}
.dn>.tarjeta{margin-bottom:12px}
.dn-hero{background:linear-gradient(135deg,var(--negro),#2C2C2C);color:#fff;border:0}
.dn-hero .nota{color:#D1D5DB}.dn-grande{font-size:2.6rem;font-weight:800;margin:2px 0 8px}
.dn-mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 4px;text-align:center}
.dn-mini b{font-size:1.15rem}
.dn-fila{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--borde)}
button.dn-ped{width:100%;text-align:left}
.dn-det{background:#FAFAF8;border-radius:10px;padding:10px;margin:0 0 8px;font-size:.92rem}
.dn-dia{display:flex;justify-content:space-between;gap:8px;padding:12px 0 4px;color:var(--texto-suave);font-size:.85rem;text-transform:capitalize}
.dn-tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:#fff;border-top:1px solid var(--borde);padding-bottom:env(safe-area-inset-bottom);z-index:30;max-width:560px;margin:0 auto}
.dn-tabs button{flex:1;padding:14px 4px;font-weight:700;color:#6B7280;border-top:3px solid transparent}
.dn-tabs button[aria-current="true"]{color:var(--rojo);border-top-color:var(--rojo)}

/* ---- Pedidos (tarjetas con línea de tiempo) ---- */
.pcard{padding:0;margin-bottom:12px;overflow:hidden}
.pcab{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;text-align:left}
.ph{color:var(--texto-suave);font-size:.8rem;min-width:62px}.pic{width:40px;height:40px;border-radius:12px;background:#FEF3E8;display:grid;place-items:center;flex-shrink:0}
.pn{flex:1}.ptag{background:#FDE9C8;color:#92400E;border-radius:6px;padding:1px 8px;font-size:.75rem;font-weight:700}.pt{text-align:right}
.pdet{padding:0 16px 16px}
.plinea{display:flex;justify-content:space-between;padding:16px 8px;border:1px solid var(--borde);border-radius:14px;margin-bottom:12px}
.paso{flex:1;text-align:center;position:relative}.paso small{display:block;color:var(--texto-suave);font-size:.72rem}
.paso::before{content:"";position:absolute;top:15px;left:-50%;width:100%;height:3px;background:#E5E7EB;z-index:0}.paso:first-child::before{display:none}
.paso.hecho::before,.paso.actual::before{background:var(--dorado)}
.dot{position:relative;z-index:1;display:inline-grid;place-items:center;width:32px;height:32px;border-radius:50%;background:#fff;border:2px solid #E5E7EB;font-size:.8rem}
.paso.hecho .dot{background:var(--rojo);border-color:var(--rojo);color:#fff}.paso.actual .dot{background:var(--rojo);border-color:#F5A39B;box-shadow:0 0 0 4px rgba(200,55,45,.2);color:#fff}
.pinfo{display:flex;gap:10px;align-items:center;border:1px solid var(--borde);border-radius:12px;padding:10px 12px;max-width:320px}
.pitems{border:1px solid var(--borde);border-radius:12px;padding:0 12px}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}.pgrid>div{border:1px solid var(--borde);border-radius:12px;padding:10px 12px}
.pq{font-weight:700}.pq[aria-pressed="true"]{background:#DBEAFE;border-color:#93C5FD;color:#1E3A8A}
.pq--cancelled{color:#B91C1C}.pq--ready{background:#ECFDF5;color:#065F46}.pq--preparing{background:#FFF7ED;color:#9A3412}
.pimp{display:block;width:100%;margin-top:12px;padding:12px;text-align:center}
@media(max-width:700px){.pgrid{grid-template-columns:1fr}}
/* ---- opciones de platillo / recompensas ---- */
.opc{border:1px solid var(--borde);border-radius:12px;margin:0 0 10px;padding:8px 12px}.opc legend{font-weight:800;padding:0 6px}
.opc-o{display:flex;gap:8px;align-items:center;padding:6px 0;margin:0;color:var(--texto);font-size:.95rem}
#dlg-opc,#dlg-plato{max-width:440px;width:92vw}

/* Ajustes para celular */
/* ==========================================================
   7. MÓVIL
   ========================================================== */
@media (max-width: 900px) {
  .menu { position: fixed; z-index: 50; left: 0; transform: translateX(-100%); transition: transform .25s; }
  .menu.abierto { transform: none; }
  .boton-menu {
    display: flex; position: fixed; top: 14px; left: 14px; z-index: 60;
    width: 42px; height: 42px; border-radius: 10px; background: var(--rojo); color: #fff;
    align-items: center; justify-content: center;
  }
  .contenido { padding: 70px 16px 24px; }
  .barra__fila { grid-template-columns: 100px 1fr 32px; }
}

</style>
</head>
<body>
<div class="app">

  <!-- ===== Menú lateral (se genera con JS desde la lista de abajo) ===== -->
  <aside class="menu" id="menu" aria-label="Navegación principal">
    <div class="menu__marca">
      <strong>Sushi Pu'uk</strong>
      <span>Panel de administración</span>
    </div>
    <nav class="menu__lista" id="menu-lista"></nav>
    <div class="menu__pie" id="menu-pie"></div>
  </aside>
  <button class="boton-menu" id="boton-menu" aria-label="Abrir menú">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
  </button>

  <!-- ===== Contenido ===== -->
  <main class="contenido"><div id="toast" role="status"></div><section id="v-reportes" data-vista hidden>

    <header class="encabezado">
      <div>
        <h1>Reportes de ventas</h1>
        <p>Análisis detallado de ventas</p>
      </div>
      <button class="boton-exportar" id="exportar">Exportar a CSV</button>
    </header>

    <section class="tarjeta periodo" aria-labelledby="periodo-titulo">
      <p class="periodo__titulo" id="periodo-titulo">Período</p>
      <p class="periodo__ayuda" id="periodo-rango">Selecciona el rango de fechas</p>
      <div class="periodo__botones" id="periodo-botones"></div>
    </section>

    <section class="indicadores" id="indicadores" aria-label="Resumen"></section>

    <section class="graficas">
      <article class="tarjeta grafica">
        <h2>Ventas por día</h2>
        <div id="grafica-ventas"></div>
      </article>
      <article class="tarjeta grafica">
        <h2>Métodos de pago</h2>
        <div id="grafica-pagos"></div>
      </article>
    </section>

    <article class="tarjeta">
      <h2>Estado de las órdenes</h2>
      <div id="grafica-estados"></div>
    </article>

  </section><section id="v-caja" data-vista hidden></section><section id="v-pedidos" data-vista hidden></section><section id="v-cocina" data-vista hidden></section><section id="v-chat" data-vista hidden></section><section id="v-meseros" data-vista hidden></section><section id="v-dueno" data-vista hidden></section><section id="v-clientes" data-vista hidden></section><section id="v-lealtad" data-vista hidden></section><section id="v-estadisticas" data-vista hidden></section><section id="v-impresora" data-vista hidden></section><section id="v-mesas" data-vista hidden></section><section id="v-promos" data-vista hidden></section><section id="v-menu" data-vista hidden></section><section id="v-config" data-vista hidden></section><dialog id="dlg"><pre id="dlg-t"></pre><button class="chip" onclick="this.closest('dialog').close()">Cerrar</button></dialog><dialog id="dlg-opc"><h2 id="opc-t"></h2><div id="opc-body"></div><div class="periodo__botones" style="margin-top:12px"><button class="btn-rojo" data-act="opc-ok">Agregar</button><button class="chip" data-act="opc-no">Cancelar</button></div></dialog><dialog id="dlg-plato"><h2>Agregar platillo</h2><label>Nombre</label><input class="campo" id="pl-n" maxlength="60"><label>Categoría</label><select class="campo" id="pl-cat"></select><label>Precio</label><input class="campo" id="pl-c" type="number" min="0" step="0.5"><label>Descripción</label><textarea class="campo" id="pl-d" rows="3" maxlength="300"></textarea><label>Foto</label><div class="fila" style="padding:0"><span id="pl-prev"></span><label class="btn-verde" style="margin:0;cursor:pointer">⬆ Elegir foto<input type="file" accept="image/*" hidden data-plimg="1"></label></div><label class="fila" style="padding:8px 0;gap:6px"><input type="checkbox" id="pl-promo"> Mostrar también en Promos</label><div class="periodo__botones" style="margin-top:12px"><button class="btn-rojo" data-act="plato-ok">Guardar platillo</button><button class="chip" data-act="plato-no">Cancelar</button></div></dialog><dialog id="dlg-can"><h2 id="can-t">Cancelar pedido</h2><label>Motivo (le avisa a la caja)</label><textarea class="campo" id="can-m" rows="3" placeholder="Ej. no hay camarón"></textarea><div class="periodo__botones"><button class="btn-rojo" data-act="can-ok">Cancelar pedido</button><button class="chip" data-act="can-cerrar">Volver</button></div></dialog></main>
</div>

or:var(--negro);font-size:1.2rem}\n/* categor\u00edas */\n.tabs{display:flex;gap:6px;overflow-x:auto;margin:0 -16px;padding:14px 16px 0;border-bottom:3px solid #D6D0C6;scrollbar-width:none}\n.tab{white-space:nowrap;padding:10px 16px;color:var(--gris);border-radius:99px 99px 0 0;border:2px solid transparent}\n.tab[aria-selected=\"true\"]{border-color:#9AA1AD;border-radius:99px;color:var(--negro);margin-bottom:6px}\n/* lista y cuadr\u00edcula */\n.fila{display:flex;gap:14px;padding:16px 0;text-align:left;width:100%;align-items:flex-start}\n.fila h3{font-size:1.35rem;letter-spacing:.02em}.fila p{margin:4px 0 6px;color:var(--gris);font-size:.88rem}\n.precio{color:var(--rojo);font-size:1.15rem}\n.foto{width:100px;height:120px;border-radius:16px;object-fit:cover;background:#D9D2C5;flex-shrink:0;display:grid;place-items:center;font-size:2rem}\n.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}\n.card{background:var(--tarj);border-radius:16px;overflow:hidden;text-align:left;position:relative}\n.card img,.card .foto{width:100%;height:112px;border-radius:0}\n.card .t{padding:8px 10px 10px}.card b{display:block;font-weight:400;font-size:.9rem;min-height:2.5em}\n.mas{position:absolute;right:8px;bottom:8px;width:32px;height:32px;border-radius:50%;background:var(--rojo);color:#fff;font-size:1.2rem;line-height:1}\n.q{display:flex;gap:8px;margin:14px 0}\n/* tarjetas */\n.caja{background:var(--tarj);border-radius:18px;padding:16px;margin:12px 0}\n.caja h2{font-size:1.1rem;font-weight:700;margin-bottom:8px}\n.nota{color:var(--gris);font-size:.85rem}\nlabel{display:block;font-size:.78rem;font-weight:700;color:var(--gris);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.03em}\n.campo{width:100%;padding:12px;border-radius:12px;border:1px solid var(--borde);font:inherit;background:#fff}\n.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{padding:9px 14px;border-radius:99px;background:#fff;border:1px solid var(--borde);font-weight:700;font-size:.88rem}\n.chip[aria-pressed=\"true\"]{background:var(--rojo);color:#fff;border-color:var(--rojo)}\n.cant{display:flex;align-items:center;gap:10px}.cant button{width:36px;height:36px;border-radius:50%;background:#fff;border:1px solid var(--borde);font-weight:800}\n/* barra inferior */\n.nav{position:fixed;left:0;right:0;bottom:0;background:var(--fondo);border-radius:26px 26px 0 0;box-shadow:0 -4px 20px rgba(0,0,0,.08);display:flex;justify-content:space-around;padding:10px 8px calc(10px + env(safe-area-inset-bottom));z-index:20;max-width:560px;margin:0 auto}\n.nav button{display:grid;justify-items:center;gap:2px;padding:8px 18px;border-radius:18px;color:var(--gris);font-size:.78rem}.nav b{font-size:1.4rem;font-weight:400}\n.nav button[aria-current=\"page\"]{background:var(--rojo);color:#fff}\n.carro{position:fixed;left:12px;right:12px;bottom:calc(86px + env(safe-area-inset-bottom));max-width:536px;margin:0 auto;z-index:19}\n.carro button{width:100%;display:flex;justify-content:space-between;background:var(--negro);color:#fff;border-radius:16px;padding:15px 18px;font-weight:800}\n/* hoja de producto / ventanas */\n.vel{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;display:flex;align-items:flex-end}\n.hoja{background:var(--fondo);width:100%;max-width:560px;margin:0 auto;border-radius:24px 24px 0 0;max-height:92vh;overflow-y:auto;padding:0 0 20px}\n.hoja img.gr{width:100%;height:220px;object-fit:cover}\n.hoja .in{padding:0 18px}\nfieldset{border:1px solid var(--borde);border-radius:14px;margin:12px 0;padding:6px 12px}legend{font-weight:800;padding:0 6px}\n.op{display:flex;gap:10px;align-items:center;padding:8px 0}\n.grande{display:flex;justify-content:center;width:100%;background:var(--rojo);color:#fff;border-radius:16px;padding:16px;font-weight:800;margin-top:14px}.grande:disabled{opacity:.4}\n.atras{background:#1A1A1A;color:#fff;border-radius:12px;padding:10px 16px;font-weight:700}\n/* lealtad */\n.tarj{border-radius:26px;padding:16px;color:var(--t);background:var(--f) center/cover;position:relative;overflow:hidden}\n.tarj::before{content:\"\";position:absolute;inset:0;background:rgba(0,0,0,.45)}.tarj>*{position:relative}\n.sellos{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;justify-items:center;margin:14px 0}\n.sello{width:56px;height:56px;border-radius:50%;border:2px dashed rgba(255,255,255,.55);display:grid;place-items:center;color:rgba(255,255,255,.7);font-size:1.1rem}\n.sello.on{background:var(--a);border:0;color:#111}.sello img{width:32px;height:32px;border-radius:50%;object-fit:cover}\n.prog{height:10px;background:rgba(255,255,255,.2);border-radius:99px;overflow:hidden;flex:1}.prog i{display:block;height:100%;background:var(--rojo)}\n.cod{background:#fff;border-radius:18px;padding:14px;text-align:center;margin-top:12px;color:#111}.cod svg{width:100%;height:70px}.cod code{letter-spacing:.2em;font-weight:700}\n.oscuro{background:#1A1A1A;color:#fff;border-radius:18px;padding:16px;margin:12px 0}\n.dos{display:grid;grid-template-columns:1fr 1fr;gap:12px}\n/* seguimiento */\n.estado{border-radius:22px;padding:20px;color:#fff;display:flex;justify-content:space-between;align-items:center;gap:10px}\n.estado b{font-size:1.6rem}.pasos{display:flex;background:var(--tarj);border-radius:18px;padding:16px 6px;margin:12px 0}\n.p{flex:1;text-align:center;position:relative;font-size:.7rem;color:var(--gris)}.p span{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:#fff;border:2px solid #D1D5DB;position:relative;z-index:1}\n.p::before{content:\"\";position:absolute;top:16px;left:-50%;width:100%;height:3px;background:#D1D5DB}.p:first-child::before{display:none}\n.p.h::before{background:#4CAF6A}.p.h span,.p.a span{background:#4CAF6A;border-color:#4CAF6A;color:#fff}.p.a{color:var(--negro);font-weight:700}\n.codigo{background:#1A1A1A;color:#fff;border-radius:18px;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;border:2px solid var(--rojo)}\n.codigo b{font-size:2rem;letter-spacing:.04em}.verde{background:#4CD16B;color:#fff;border-radius:14px;padding:10px 16px;font-weight:700}\n.pie{background:#1E1A19;color:#fff;margin-top:30px;padding:26px 0;text-align:center}.pie h2{font-weight:300;letter-spacing:.06em}\n.redes{display:flex;gap:10px;justify-content:center;margin-top:12px;flex-wrap:wrap}.redes a{padding:10px 16px;border:1px solid #444;border-radius:14px;color:#fff;text-decoration:none;font-size:.85rem}\n#impr{display:none}\n@media print{body>*:not(#impr){display:none!important}#impr{display:block;padding:20px;font-family:Georgia,serif}#impr h1{text-align:center}#impr h2{border-bottom:1px solid #999;margin:18px 0 6px}#impr p{margin:4px 0;display:flex;justify-content:space-between;gap:20px}}\n</style>\n</head>\n<body>\n<div id=\"app\"></div>\n<div id=\"impr\"></div>\n<script>\n/* Men\u00fa para clientes (archivo independiente). Inicio \u00b7 Men\u00fa \u00b7 Lealtad \u00b7 Sucursales \u00b7 Seguimiento del pedido.\n   Lleva dentro una copia del men\u00fa que genera el panel. Si se abre junto al panel (mismo navegador y sitio) usa los datos\n   en vivo: pedidos, cuentas del Club y seguimiento funcionan al instante. Si no, el pedido se manda por WhatsApp. */\nlet ultimoEstado=null;\nconst SNAP=/*DATOS_MENU*/null;\nconst C128=[\"11011001100\", \"11001101100\", \"11001100110\", \"10010011000\", \"10010001100\", \"10001001100\", \"10011001000\", \"10011000100\", \"10001100100\", \"11001001000\", \"11001000100\", \"11000100100\", \"10110011100\", \"10011011100\", \"10011001110\", \"10111001100\", \"10011101100\", \"10011100110\", \"11001110010\", \"11001011100\", \"11001001110\", \"11011100100\", \"11001110100\", \"11101101110\", \"11101001100\", \"11100101100\", \"11100100110\", \"11101100100\", \"11100110100\", \"11100110010\", \"11011011000\", \"11011000110\", \"11000110110\", \"10100011000\", \"10001011000\", \"10001000110\", \"10110001000\", \"10001101000\", \"10001100010\", \"11010001000\", \"11000101000\", \"11000100010\", \"10110111000\", \"10110001110\", \"10001101110\", \"10111011000\", \"10111000110\", \"10001110110\", \"11101110110\", \"11010001110\", \"11000101110\", \"11011101000\", \"11011100010\", \"11011101110\", \"11101011000\", \"11101000110\", \"11100010110\", \"11101101000\", \"11101100010\", \"11100011010\", \"11101111010\", \"11001000010\", \"11110001010\", \"10100110000\", \"10100001100\", \"10010110000\", \"10010000110\", \"10000101100\", \"10000100110\", \"10110010000\", \"10110000100\", \"10011010000\", \"10011000010\", \"10000110100\", \"10000110010\", \"11000010010\", \"11001010000\", \"11110111010\", \"11000010100\", \"10001111010\", \"10100111100\", \"10010111100\", \"10010011110\", \"10111100100\", \"10011110100\", \"10011110010\", \"11110100100\", \"11110010100\", \"11110010010\", \"11011011110\", \"11011110110\", \"11110110110\", \"10101111000\", \"10100011110\", \"10001011110\", \"10111101000\", \"10111100010\", \"11110101000\", \"11110100010\", \"10111011110\", \"10111101110\", \"11101011110\", \"11110101110\", \"11010000100\", \"11010010000\", \"11010011100\"];\nconst KEY=\"sushipuuk-panel-v3\",K_CTA=\"puuk-cuenta\",K_PED=\"puuk-pedidos\";\nconst $=id=>document.getElementById(id);\nconst esc=s=>String(s==null?\"\":s).replace(/[&<>\"]/g,c=>({\"&\":\"&amp;\",\"<\":\"&lt;\",\">\":\"&gt;\",'\"':\"&quot;\"}[c]));\nconst $m=n=>\"$\"+Number(n).toLocaleString(\"es-MX\",{minimumFractionDigits:2,maximumFractionDigits:2});\nconst dig=s=>String(s||\"\").replace(/\\D/g,\"\");\nconst ls=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v);}catch(e){}return null;};\nconst mesa=(new URLSearchParams(location.search).get(\"n\")||\"\").replace(/\\D/g,\"\").slice(0,2);\n\n/* ---------- datos ---------- */\nlet rawCache=null,dCache=null;\nfunction panel(){const r=ls(KEY);if(r!==rawCache){rawCache=r;try{const d=JSON.parse(r);dCache=d&&d.menu&&d.ordenes?d:null;}catch(e){dCache=null;}}return dCache;}\nfunction conv(r,vivo,generado){\n  const grp=n=>(r.mods||[]).find(g=>g.n===n);\n  const cats=(r.menu||[]).map(c=>({e:c.e,n:c.n,p:c.p.filter(p=>p.on&&p.c>0).map(p=>({n:p.n,c:p.c,d:p.d||\"\",img:p.img||p.r||\"\",promo:!!p.promo,dest:!!p.dest,\n    g:(p.m||[]).map(grp).filter(g=>g&&g.o&&g.o.length).map(g=>({n:g.n,req:!!g.req,o:g.o.map(o=>typeof o===\"string\"?{n:o,p:0}:{n:o.n,p:o.p||0})}))}))})).filter(c=>c.p.length);\n  return{vivo,generado,neg:r.neg||{},cats,prog:r.prog||{},dis:r.dis||{},recomp:(r.recomp||[]).filter(x=>x.activa!==false)};\n}\nfunction datos(){const d=panel();if(d)return conv(d,true);return SNAP?conv(SNAP,false,SNAP.generado):null;}\nconst S={tab:\"inicio\",cat:\"todos\",q:\"\",carro:[],prod:null,sel:{},qty:1,nota:\"\",f:{nombre:\"\",tel:\"\",email:\"\",dir:\"\",nota:\"\",tipo:mesa?\"mesa\":\"recoger\",cuenta:false},reg:{nombre:\"\",tel:\"\",email:\"\"},ent:{tel:\"\",code:\"\"},seg:null,segq:{id:\"\",tel:\"\"},snd:false,msg:\"\"};\nconst cuenta=()=>{try{return JSON.parse(ls(K_CTA)||\"null\");}catch(e){return null;}};\nconst total=()=>S.carro.reduce((s,i)=>s+i.c*i.q,0),piezas=()=>S.carro.reduce((s,i)=>s+i.q,0);\nconst todos=D=>D.cats.flatMap(c=>c.p);\nconst cliente=()=>{const a=cuenta(),d=panel();return a&&d?d.clientes.find(c=>c.id===a.id&&c.code===a.code):null;};\n\n/* ---------- c\u00f3digo de barras (Code 128-B) ---------- */\nfunction barras(txt){\n  const v=[104];for(const ch of txt)v.push(ch.charCodeAt(0)-32);\n  let s=104;for(let i=1;i<v.length;i++)s+=v[i]*i;v.push(s%103);\n  const bits=v.map(x=>C128[x]).join(\"\")+\"1100011101011\";\n  let x=0,r=\"\";while(x<bits.length){if(bits[x]===\"1\"){let n=x;while(bits[n]===\"1\")n++;r+=`<rect x=\"${x+10}\" y=\"0\" width=\"${n-x}\" height=\"40\"/>`;x=n;}else x++;}\n  return `<svg viewBox=\"0 0 ${bits.length+20} 40\" preserveAspectRatio=\"none\" role=\"img\" aria-label=\"C\u00f3digo de barras ${esc(txt)}\" fill=\"#111\">${r}</svg>`;\n}\nconst ABC=\"ABCDEFGHJKLMNPQRSTUVWXYZ23456789\";\nfunction codigoNuevo(d){let c;do{c=\"PUUK-\"+Array.from({length:8},()=>ABC[Math.floor(Math.random()*ABC.length)]).join(\"\");}while(d.clientes.some(x=>x.code===c));return c;}\n\n/* ---------- piezas ---------- */\nconst nivelDe=(c,P)=>c.vis>=(P.oro||25)?\"Oro\":c.vis>=(P.plata||10)?\"Plata\":\"Bronce\";\nconst NIVC={Bronce:\"#CD7F32\",Plata:\"#9CA3AF\",Oro:\"#D4AF37\"};\nconst foto=(p,cl)=>p.img?`<img class=\"${cl||\"foto\"}\" src=\"${esc(p.img)}\" alt=\"\" loading=\"lazy\" onerror=\"this.outerHTML='<div class=&quot;${cl||\"foto\"}&quot;>\ud83c\udf63</div>'\">`:`<div class=\"${cl||\"foto\"}\">\ud83c\udf63</div>`;\nconst navBar=()=>`<nav class=\"nav\">${[[\"inicio\",\"\ud83c\udfe0\",\"Inicio\"],[\"menu\",\"\ud83c\udf74\",\"men\u00fa\"],[\"lealtad\",\"\u2661\",\"Lealtad\"],[\"suc\",\"\ud83d\udccd\",\"Sucursales\"]].map(([k,i,t])=>`<button data-act=\"tab\" data-v=\"${k}\" ${S.tab===k?'aria-current=\"page\"':\"\"}><b>${i}</b>${t}</button>`).join(\"\")}</nav>`\n  +(S.carro.length&&![\"carro\",\"seg\"].includes(S.tab)?`<div class=\"carro\"><button data-act=\"carro\"><span>Ver mi pedido (${piezas()})</span><span>${$m(total())}</span></button></div>`:\"\");\nconst tabsCat=D=>`<div class=\"tabs\" role=\"tablist\"><button class=\"tab\" role=\"tab\" data-act=\"cat\" data-v=\"todos\" aria-selected=\"${!S.q&&S.cat===\"todos\"}\">Todos</button>${D.cats.some(c=>c.p.some(p=>p.promo))?`<button class=\"tab\" role=\"tab\" data-act=\"cat\" data-v=\"promo\" aria-selected=\"${!S.q&&S.cat===\"promo\"}\">Promos</button>`:\"\"}${D.cats.map((c,i)=>`<button class=\"tab\" role=\"tab\" data-act=\"cat\" data-v=\"${i}\" aria-selected=\"${!S.q&&S.cat===i}\">${esc(c.n)}</button>`).join(\"\")}</div>`;\nfunction lista(D){\n  const q=S.q.trim().toLowerCase();\n  if(q)return todos(D).filter(p=>(p.n+\" \"+p.d).toLowerCase().includes(q));\n  if(S.cat===\"todos\")return todos(D);if(S.cat===\"promo\")return todos(D).filter(p=>p.promo);\n  return(D.cats[S.cat]||D.cats[0]).p;\n}\nfunction pie(D){const N=D.neg,wa=dig(N.tel);return `<footer class=\"pie\"><div class=\"w\"><div style=\"font-size:1.6rem\">\ud83c\udf63</div><h2>\u00a1S\u00cdGUENOS EN <span style=\"color:var(--rojo)\">REDES</span>!</h2><p class=\"nota\" style=\"color:#aaa\">Con\u00e9ctate con nosotros para estar al tanto de promociones especiales y novedades.</p><div class=\"redes\">${N.fb?`<a href=\"${esc(N.fb)}\" target=\"_blank\" rel=\"noopener\">Facebook</a>`:\"\"}${N.ig?`<a href=\"${esc(N.ig)}\" target=\"_blank\" rel=\"noopener\">Instagram</a>`:\"\"}${N.tt?`<a href=\"${esc(N.tt)}\" target=\"_blank\" rel=\"noopener\">TikTok</a>`:\"\"}${wa?`<a href=\"https://wa.me/${wa.length===10?\"52\"+wa:wa}\" target=\"_blank\" rel=\"noopener\">WhatsApp</a>`:\"\"}</div></div></footer>`;}\n\n/* ---------- pantallas ---------- */\nfunction vInicio(D){\n  const H=todos(D).find(p=>p.dest&&p.img)||todos(D).find(p=>p.img)||todos(D)[0],L=lista(D);\n  return `<header class=\"hero\" style=\"${H&&H.img?`background-image:url('${esc(H.img)}')`:\"\"}\"><div class=\"logo-top\">${esc((D.neg.n||\"\").toUpperCase())}${D.neg.lema?`<div style=\"font-weight:400;font-size:.6rem;letter-spacing:.2em\">${esc(D.neg.lema.toUpperCase())}</div>`:\"\"}</div><div class=\"w\"><h1>${esc(H?H.n:D.neg.n||\"Men\u00fa\")}</h1><p>${esc(H?H.d:\"\")}</p>${mesa?`<p><b>Mesa ${esc(mesa)}</b></p>`:\"\"}<div><button class=\"btn rojo\" data-act=\"tab\" data-v=\"menu\">Ordena ahora</button></div><div style=\"margin-top:10px\"><button class=\"btn suave\" data-act=\"seguir\">\ud83d\udce6 Seguir mi pedido</button></div><div class=\"busca\"><input id=\"q\" placeholder=\"Buscar productos\u2026\" value=\"${esc(S.q)}\" autocomplete=\"off\" aria-label=\"Buscar productos\"><button class=\"pin\" data-act=\"tab\" data-v=\"suc\" aria-label=\"Sucursales\">\ud83d\udccd</button></div></div></header>`\n   +`<main class=\"w\">${tabsCat(D)}${L.length?L.map(p=>`<button class=\"fila\" data-act=\"prod\" data-n=\"${esc(p.n)}\"><span style=\"flex:1\"><h3>${esc(p.n)}</h3><p>${esc(p.d)}</p><span class=\"pr const moneda = new Intl.NumberFormat("es-MX", { style: "currency", currency: "MXN" });

/* ==========================================================
   FECHAS
   ========================================================== */
function aTexto(d) {                       // Date -> "2026-10-03"
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const dia = String(d.getDate()).padStart(2, "0");
  return `${d.getFullYear()}-${m}-${dia}`;
}
function aFecha(texto) {                   // "2026-10-03" -> Date (hora local)
  const [a, m, d] = texto.split("-").map(Number);
  return new Date(a, m - 1, d);
}
function etiquetaDia(d)  { return d.toLocaleDateString("es-MX", { day: "numeric", month: "short" }).replace(".", ""); }
function etiquetaMes(d)  { return d.toLocaleDateString("es-MX", { month: "short" }).replace(".", ""); }

// Devuelve el rango [desde, hasta] según el período elegido.
function rangoDe(periodo) {
  const hoy = new Date(); hoy.setHours(0, 0, 0, 0);
  const desde = new Date(hoy);
  if (periodo === "semanal") desde.setDate(hoy.getDate() - 6);
  if (periodo === "mensual") desde.setDate(1);
  if (periodo === "anual")   { desde.setMonth(0); desde.setDate(1); }
  return { desde, hasta: hoy };
}

/* ==========================================================
   CÁLCULOS
   ========================================================== */
function filtrar(periodo) {
  const { desde, hasta } = rangoDe(periodo);
  return ORDENES.filter(o => { const f = aFecha(o.fecha); return f >= desde && f <= hasta && o.estado !== "cancelled"; });
}

function resumen(lista) {
  const total = lista.reduce((s, o) => s + o.total, 0);
  return {
    total,
    ordenes: lista.length,
    ticket: lista.length ? total / lista.length : 0,
    clientes: new Set(lista.map(o => o.cliente).filter(c => c && c !== "mostrador")).size,
  };
}

// Serie para la línea: un punto por día (o por mes en "anual"), con $0 donde no hubo ventas.
function serieVentas(lista, periodo) {
  const { desde, hasta } = rangoDe(periodo);
  const porMes = periodo === "anual";
  const puntos = new Map();
  const cursor = new Date(desde);
  while (cursor <= hasta) {
    const clave = porMes ? `${cursor.getFullYear()}-${cursor.getMonth()}` : aTexto(cursor);
    puntos.set(clave, { etiqueta: porMes ? etiquetaMes(cursor) : etiquetaDia(cursor), valor: 0 });
    porMes ? cursor.setMonth(cursor.getMonth() + 1, 1) : cursor.setDate(cursor.getDate() + 1);
  }
  lista.forEach(o => {
    const f = aFecha(o.fecha);
    const clave = porMes ? `${f.getFullYear()}-${f.getMonth()}` : o.fecha;
    if (puntos.has(clave)) puntos.get(clave).valor += o.total;
  });
  return [...puntos.values()];
}

function contar(lista, campo, sumar = false) {
  const r = {};
  lista.forEach(o => { r[o[campo]] = (r[o[campo]] || 0) + (sumar ? o.total : 1); });
  return r;
}

const $ = id => document.getElementById(id);

function dibujarIndicadores(r) {
  const tarjetas = [
    ["Ventas totales", moneda.format(r.total), "var(--rojo)"],
    ["Órdenes", r.ordenes, "var(--dorado)"],
    ["Ticket promedio", moneda.format(r.ticket), "var(--negro)"],
    ["Clientes únicos", r.clientes, "var(--turquesa)"],
  ];
  $("indicadores").innerHTML = tarjetas.map(([etiqueta, valor, color]) => `
    <article class="tarjeta indicador" style="--color:${color}">
      <p class="indicador__etiqueta">${etiqueta}</p>
      <p class="indicador__valor">${valor}</p>
    </article>`).join("");
}

function dibujarLinea(serie, hayVentas) {
  if (!hayVentas) {
    $("grafica-ventas").innerHTML = `<p class="vacio">No hay ventas en este período.</p>`;
    return;
  }
  const W = 560, H = 260, m = { i: 56, d: 16, s: 14, b: 34 };
  const max = Math.max(...serie.map(p => p.valor)) || 1;
  const x = i => m.i + (serie.length === 1 ? (W - m.i - m.d) / 2 : i * (W - m.i - m.d) / (serie.length - 1));
  const y = v => H - m.b - (v / max) * (H - m.b - m.s);

  const guias = [0, .25, .5, .75, 1].map(f => {
    const v = max * f;
    return `<line x1="${m.i}" x2="${W - m.d}" y1="${y(v)}" y2="${y(v)}" stroke="#ECECE8"/>
            <text x="${m.i - 8}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="#6B7280">${Math.round(v)}</text>`;
  }).join("");

  // Muestra como máximo ~6 etiquetas en el eje X para que no se encimen.
  const paso = Math.ceil(serie.length / 6);
  const ejeX = serie.map((p, i) => i % paso ? "" :
    `<text x="${x(i)}" y="${H - 10}" text-anchor="middle" font-size="11" fill="#6B7280">${p.etiqueta}</text>`).join("");

  const linea = serie.map((p, i) => `${i ? "L" : "M"}${x(i)},${y(p.valor)}`).join(" ");
  const puntos = serie.map((p, i) => p.valor
    ? `<circle cx="${x(i)}" cy="${y(p.valor)}" r="4" fill="#fff" stroke="var(--rojo)" stroke-width="3">
         <title>${p.etiqueta}: ${moneda.format(p.valor)}</title></circle>` : "").join("");

  $("grafica-ventas").innerHTML = `
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Ventas por día">
      ${guias}${ejeX}
      <path d="${linea}" fill="none" stroke="var(--rojo)" stroke-width="3" stroke-linejoin="round"/>
      ${puntos}
    </svg>`;
}

function dibujarDona(montos) {
  const total = Object.values(montos).reduce((a, b) => a + b, 0);
  if (!total) { $("grafica-pagos").innerHTML = `<p class="vacio">No hay pagos en este período.</p>`; return; }

  const R = 70, C = 2 * Math.PI * R;
  let acumulado = 0;
  const arcos = Object.entries(montos).map(([clave, monto]) => {
    const largo = (monto / total) * C;
    const color = (METODOS[clave] || { color: "#999" }).color;
    const arco = `<circle r="${R}" cx="100" cy="100" fill="none" stroke="${color}" stroke-width="34"
      stroke-dasharray="${largo} ${C - largo}" stroke-dashoffset="${-acumulado}" transform="rotate(-90 100 100)"/>`;
    acumulado += largo;
    return arco;
  }).join("");

  const leyenda = Object.entries(montos).map(([clave, monto]) => {
    const info = METODOS[clave] || { nombre: clave, color: "#999" };
    return `<li style="--color:${info.color}"><i></i>${info.nombre}<b>${moneda.format(monto)} · ${Math.round(monto / total * 100)}%</b></li>`;
  }).join("");

  $("grafica-pagos").innerHTML = `
    <svg viewBox="0 0 200 200" style="max-width:220px;margin:0 auto" role="img" aria-label="Métodos de pago">${arcos}</svg>
    <ul class="leyenda">${leyenda}</ul>`;
}

function dibujarEstados(conteo) {
  const total = Object.values(conteo).reduce((a, b) => a + b, 0);
  if (!total) { $("grafica-estados").innerHTML = `<p class="vacio">No hay órdenes en este período.</p>`; return; }
  $("grafica-estados").innerHTML = `<div class="barras">` + Object.entries(conteo).map(([estado, n]) => `
    <div class="barra__fila">
      <span>${ESTADOS[estado] || estado}</span>
      <div class="barra__pista"><div class="barra__relleno" style="width:${n / total * 100}%"></div></div>
      <b>${n}</b>
    </div>`).join("") + `</div>`;
}

/* ==========================================================
   PANEL: junta todo según el período elegido
   ========================================================== */
let periodoActual = "mensual";
let listaActual = [];

function actualizar() {
  listaActual = filtrar(periodoActual);
  const { desde, hasta } = rangoDe(periodoActual);
  $("periodo-rango").textContent = `Del ${etiquetaDia(desde)} al ${etiquetaDia(hasta)} de ${hasta.getFullYear()}`;

  document.querySelectorAll("#periodo-botones .chip").forEach(b =>
    b.setAttribute("aria-pressed", b.dataset.id === periodoActual));

  const r = resumen(listaActual);
  dibujarIndicadores(r);
  dibujarLinea(serieVentas(listaActual, periodoActual), r.ordenes > 0);
  dibujarDona(contar(listaActual, "metodo", true));
  dibujarEstados(contar(listaActual, "estado"));
  $("exportar").disabled = listaActual.length === 0;
}

/* Acceso del dueño: nombre y contraseña guardados como huella (hash) en este aparato.
   Es un bloqueo básico para que nadie curiosee las ventas en el teléfono del dueño.
   NO es seguridad de servidor: la protección real llegará con la base de datos central. */
const K_CRED="sushipuuk-dueno-cred",K_INT="sushipuuk-dueno-intentos",K_SES="sushipuuk-dueno-ses";
const MIN_SESION=30,MAX_INT=5,BLOQUEO_MIN=5;
const ssGet=k=>{try{return sessionStorage.getItem(k);}catch(e){return null;}};
const ssSet=(k,v)=>{try{if(v===null)sessionStorage.removeItem(k);else sessionStorage.setItem(k,v);}catch(e){}};
const credencial=()=>{try{return JSON.parse(lsGet(K_CRED)||"null");}catch(e){return null;}};
const hayCripto=()=>!!(window.crypto&&window.crypto.subtle);
const nuevaSal=()=>{const a=new Uint8Array(8);try{crypto.getRandomValues(a);}catch(e){for(let i=0;i<8;i++)a[i]=Math.random()*256;}return [...a].map(x=>x.toString(16).padStart(2,"0")).join("");};
// alg "s2" = SHA-256 (si el navegador lo permite); "f1" = huella simple de respaldo
async function huella(pass,sal,alg){
  const t=sal+"|"+pass;
  if(alg==="s2"){
    if(!hayCripto())throw new Error("sin cripto");
    const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));
    return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
  }
  let a=2166136261,b=5381;
  for(let r=0;r<2000;r++)for(let i=0;i<t.length;i++){a=Math.imul(a^t.charCodeAt(i),16777619)>>>0;b=(Math.imul(b,33)^t.charCodeAt(i)^a)>>>0;}
  return a.toString(16)+b.toString(16);
}
// La sesión dura mientras no pasen 30 minutos sin tocar la pantalla y se borra al cerrar la ventana
const sesionActiva=()=>{const t=+ssGet(K_SES)||0;return t>0&&Date.now()-t<MIN_SESION*60000;};
const iniciarSesion=()=>ssSet(K_SES,String(Date.now()));
const cerrarSesiones=()=>{ssSet(K_SES,null);lsSet("sushipuuk-mesero","");};
const intentos=()=>{try{return JSON.parse(lsGet(K_INT)||"{}");}catch(e){return{};}};
const bloqueadoHasta=()=>{const i=intentos();return i.hasta&&i.hasta>Date.now()?i.hasta:0;};
async function entrarDueno(pass){
  const c=credencial();if(!c)return false;
  if(bloqueadoHasta()){toast(`Demasiados intentos. Espera ${Math.ceil((bloqueadoHasta()-Date.now())/60000)} min.`);return false;}
  let h;try{h=await huella(pass,c.sal,c.alg);}catch(e){toast("Este navegador no puede verificar la contraseña.");return false;}
  if(h===c.h){lsSet(K_INT,"{}");iniciarSesion();return true;}
  const i=intentos();i.n=(i.n||0)+1;
  if(i.n>=MAX_INT){i.hasta=Date.now()+BLOQUEO_MIN*60000;i.n=0;toast(`Contraseña incorrecta. Acceso bloqueado ${BLOQUEO_MIN} minutos.`);}
  else toast(`Contraseña incorrecta. Te quedan ${MAX_INT-i.n} intentos.`);
  lsSet(K_INT,JSON.stringify(i));return false;
}

/* Cuentas de mesa de los meseros: rondas, comandas, quitar productos, cobro y comanda impresa.
   Una CUENTA es la mesa abierta. Cada vez que el mesero manda a cocina se crea una RONDA (comanda)
   que lleva SOLO los productos nuevos; lo que ya salió nunca se vuelve a mandar. */
const uid=()=>++D.uid;
const cuenta=id=>D.cuentas.find(c=>c.id===id);
const cuentaDeMesa=n=>D.cuentas.find(c=>c.abierta&&+c.mesa===+n);
const itemsVivos=c=>c.items.filter(i=>i.est!=="cancelado");
const borradores=c=>c.items.filter(i=>i.est==="borrador");
const totalCuenta=c=>itemsVivos(c).reduce((s,i)=>s+i.c*i.q,0);
const nombreMesero=()=>lsGet("sushipuuk-mesero")||"";
const RLBL={pending:"En cocina",confirmed:"Preparando",preparing:"Preparando",ready:"¡Listo para llevar!",delivered:"Entregado",cancelled:"Cancelado"};

function abrirMesa(num,nombre,mesero){
  if(cuentaDeMesa(num))return null;
  const c={id:uid(),mesa:+num,nombre:nombre.trim(),mesero,abierta:true,fecha:hoyT(),hora:horaT(),ronda:0,items:[],pideCuenta:false};
  D.cuentas.push(c);log(`Mesa ${c.mesa} (${c.nombre}) abierta por ${mesero}`);return c;
}
function agregarBorrador(c,p,opc=[],extra=0){
  const it=c.items.find(i=>i.est==="borrador"&&i.n===p.n&&!i.nota&&(i.opc||[]).join("|")===opc.join("|"));
  if(it)it.q++;else c.items.push({id:uid(),n:p.n,c:p.c+extra,q:1,nota:"",opc,est:"borrador"});
}
// Manda a cocina SOLO lo que está en borrador y lo marca como enviado
function enviarRonda(c){
  const B=borradores(c);if(!B.length)return null;
  c.ronda++;
  const cm={id:uid(),cuenta:c.id,ronda:c.ronda,mesa:c.mesa,nombre:c.nombre,mesero:c.mesero,fecha:hoyT(),hora:horaT(),estado:"pending",items:B.map(i=>({iid:i.id,n:i.n,q:i.q,nota:i.nota,opc:i.opc||[]}))};
  B.forEach(i=>{i.est="enviado";i.rid=cm.id;});
  D.comandas.push(cm);D.comandas=D.comandas.slice(-300);
  D.cola.unshift({id:`Mesa ${c.mesa} · ronda ${c.ronda}`,ref:{t:"c",id:cm.id},f:horaT(),r:Object.fromEntries(Object.entries(ruta({items:cm.items})).map(([k,v])=>[k,v.length]))});D.cola=D.cola.slice(0,20);
  log(`Mesa ${c.mesa} (${c.nombre}): ronda ${c.ronda} enviada a cocina`);
  return cm;
}
// Quita un producto: los borradores se borran sin más; los ya enviados se cancelan y, si la cocina ya los tiene, se le avisa
function quitarItem(c,iid){
  const i=c.items.find(x=>x.id===iid);if(!i)return;
  if(i.est==="borrador"){c.items=c.items.filter(x=>x!==i);return;}
  const cm=D.comandas.find(x=>x.id===i.rid);i.est="cancelado";
  if(!cm)return;
  const antes=cm.estado,l=cm.items.find(x=>x.iid===iid);if(l)l.cancelado=true;
  if(cm.items.every(x=>x.cancelado)&&cm.estado!=="delivered")cm.estado="cancelled";
  if(["confirmed","preparing","ready"].includes(antes))   // la cocina ya lo estaba haciendo: avisarle
    decir(quien(),`⚠ Mesa ${c.mesa} (${c.nombre}): quitaron ${i.q}× ${i.n} de la ronda ${cm.ronda} (estaba: ${RLBL[antes]})`,true);
  log(`Mesa ${c.mesa}: quitaron ${i.q}× ${i.n}`);
}
// Cobra la cuenta: genera UN pedido normal (con todo lo consumido) para reportes, clientes y lealtad
function cobrarCuenta(c,metodo,cid){
  const V=itemsVivos(c);if(!V.length)return null;
  const agg={};V.forEach(i=>{const k=i.n+"|"+i.c+"|"+(i.nota||"")+"|"+(i.opc||[]).join(",");agg[k]=agg[k]||{n:i.n,c:i.c,q:0,nota:i.nota||"",opc:i.opc||[]};agg[k].q+=i.q;});
  const o={id:++D.seq,fecha:hoyT(),hora:horaT(),ts:Date.now(),items:Object.values(agg),total:totalCuenta(c),metodo,tipo:"mesa",mesa:String(c.mesa),estado:"pending",cliente:cid||"mostrador",origen:"mesero",mesero:c.mesero,nombreMesa:c.nombre,nota:`Mesa ${c.mesa} · ${c.nombre}`,cuenta:c.id};
  ORDENES.push(o);completar(o);c.abierta=false;c.cerrada=horaT();c.pedido=o.id;
  log(`Mesa ${c.mesa} cobrada: ${moneda.format(o.total)} (pedido #${o.id})`);
  return o;
}
// Comanda para imprimir: una hoja por estación, y en las rondas siguientes avisa que es SOLO lo nuevo
function comandaMesaTxt(cm){
  const cab=`${negocio().toUpperCase()} · COMANDA\nMesa ${cm.mesa} · ${cm.nombre}\nMesero: ${cm.mesero||"-"}   ${cm.hora}\n`+(cm.ronda>1?`*** RONDA ${cm.ronda} · AGREGADO ***\n(solo lo nuevo; lo anterior ya salió)\n`:`RONDA 1\n`);
  return Object.entries(ruta({items:cm.items.filter(i=>!i.cancelado)})).map(([k,it])=>cab+`ESTACIÓN: ${k}\n--------------------------------\n`+it.map(i=>`${i.q} x ${i.n}`+(notaItem(i)?`\n   >> ${notaItem(i)}`:"")).join("\n")+"\n--------------------------------").join("\n\n\f\n");
}
function imprimirTxt(txt){
  $("print-area").innerHTML=txt.split("\n\n\f\n").map(t=>`<pre>${esc(t)}</pre>`).join("");
  document.body.classList.add("imprimiendo");
  setTimeout(()=>{window.print();document.body.classList.remove("imprimiendo");},50);
}

// Estado de las rondas de una mesa (para caja y meseros)
function rondasBadges(c){
  const R=D.comandas.filter(x=>x.cuenta===c.id&&x.estado!=="cancelled"),n=f=>R.filter(f).length;
  return [["En cocina",n(x=>x.estado==="pending"),""],["Preparando",n(x=>["confirmed","preparing"].includes(x.estado)),""],["¡Listo para llevar!",n(x=>x.estado==="ready"),"ok"]].filter(e=>e[1]).map(([t,k,cl])=>`<span class="badge ${cl}">${t} ${k}</span>`).join("");
}

/* ---- Pedidos ---- */
const PASOS=[["pending","Pend."],["confirmed","Conf."],["preparing","Prep."],["ready","Listo"],["delivered","OK"]];
const ESTADOS_C={pending:"Pend.",confirmed:"Conf.",preparing:"Prep.",ready:"Listo",delivered:"OK",cancelled:"Cancelado"};
const nombreDe=o=>o.nombreCliente||nomCli(o.cliente);
const telDe=o=>o.tel||(cli(o.cliente)||{}).t||"";
const horaLarga=o=>new Date(o.ts||0).toLocaleTimeString("es-MX",{hour:"2-digit",minute:"2-digit"});

function pedCard(o){
  const ab=String(S.pedAb)===String(o.id),est=o.estado,cerrado=["delivered","cancelled"].includes(est),i=PASOS.findIndex(p=>p[0]===est);
  const cab=`<button class="pcab" data-act="ped-abrir" data-id="${o.id}" aria-expanded="${ab}"><span class="ph">${horaLarga(o)}</span><span class="pic">🛍</span><span class="pn"><b>${esc(nombreDe(o).toUpperCase())}</b><br><span class="ptag">${esc(tipoT(o))}</span> <small class="nota" style="margin:0">${esc(negocio())} ${esc(D.neg.sucursal||"")}</small>${o.origen==="cliente"?` <span class="badge ok">📱 Cliente</span>`:""}</span><span class="pt"><b>${moneda.format(o.total)}</b><br><span class="badge ${est==="delivered"?"ok":est==="cancelled"?"mal":""}">${ESTADOS_C[est]}</span></span><span>${ab?"⌃":"⌄"}</span></button>`;
  if(!ab)return `<article class="tarjeta pcard">${cab}</article>`;
  const linea=est==="cancelled"?`<p class="badge mal">Cancelado${o.por?" por "+esc(o.por):""}${o.motivo?": "+esc(o.motivo):""}</p>`
    :`<div class="plinea">${PASOS.map(([k,t],x)=>`<div class="paso ${x<i?"hecho":x===i?"actual":""}"><span class="dot">${x<=i?"✓":x+1}</span><small>${t}</small></div>`).join("")}</div>`;
  const acc=cerrado?"":`<label>TIEMPO ESTIMADO DE ENTREGA (MINUTOS)</label><input class="campo" type="number" min="1" max="240" id="te-${o.id}" data-te="${o.id}" value="${o.tiempoEst||30}" style="max-width:200px"><p class="nota" style="margin:10px 0 4px">ACCIONES RÁPIDAS</p><div class="periodo__botones">${[["confirmed","Confirmar"],["preparing","Preparando"],["ready","Listo"],["delivered","Completar"],["cancelled","Cancelar"]].map(([e,t])=>`<button class="chip pq pq--${e}" data-act="ped-set" data-id="${o.id}" data-e="${e}" aria-pressed="${est===e}">${t}</button>`).join("")}</div>`;
  return `<article class="tarjeta pcard abierta">${cab}<div class="pdet">${linea}`
   +(telDe(o)?`<div class="pinfo"><span class="pic">📞</span><div><small class="nota" style="margin:0">TELÉFONO</small><br><b>${esc(telDe(o))}</b></div></div>`:"")
   +`<p class="nota" style="margin:10px 0 4px">DETALLE DEL PEDIDO</p><div class="pitems">${(o.items||[]).map(x=>`<div class="fila" style="padding:8px 0"><span style="flex:1"><b>${x.q}x ${esc(x.n)}</b>${notaItem(x)?`<br><small class="nota" style="margin:0">${esc(notaItem(x))}</small>`:""}</span><b style="color:var(--rojo)">${moneda.format(x.c*x.q)}</b></div>`).join("")}</div>`
   +(o.nota?`<p class="nota">Nota: ${esc(o.nota)}</p>`:"")
   +`<div class="pgrid"><div><small class="nota" style="margin:0">PAGO</small><br><b>${esc((METODOS[o.metodo]||{nombre:o.metodo}).nombre)}</b></div><div><small class="nota" style="margin:0">SUCURSAL</small><br><b>${esc(negocio())} ${esc(D.neg.sucursal||"")}</b></div><div><small class="nota" style="margin:0">TIEMPO EST.</small><br><b>${o.tiempoEst||30} min</b></div></div>`
   +acc+`<button class="chip pimp" data-act="ped-imp" data-id="${o.id}">🖨 Reimprimir comanda</button></div></article>`;
}
function vPedidos(){
  const L=ORDENES.filter(o=>o.fecha===hoyT()).sort((a,b)=>(b.ts||b.id)-(a.ts||a.id)),g=k=>L.filter(o=>GRUPO[o.estado]===k);
  const vis=L.filter(o=>S.ped==="todos"||GRUPO[o.estado]===S.ped),ventas=L.filter(o=>o.estado!=="cancelled").reduce((s,o)=>s+o.total,0);

// Mesas abiertas por los meseros: aquí la caja las cobra (se convierten en UN pedido con todo lo consumido)

  const A=D.cuentas.filter(c=>c.abierta);

}

/* Pantalla de cocina para tablet: tres columnas, notas por producto, cancelar, chat y rondas de mesa */
const KSIG={pending:"preparing",confirmed:"ready",preparing:"ready",ready:"delivered"};   // avanzar
const KANT={confirmed:"pending",preparing:"pending",ready:"preparing"};                    // regresar un paso
S.ks="todas";S.son=false;S.ultPend=null;S.kchat=false;S.pre="";

const minDesde=o=>Math.max(0,Math.round((Date.now()-new Date((o.fecha||hoyT())+"T"+(o.hora||"00:00")+":00"))/60000));   // minutos desde que se pidió
function beep(){try{const c=new(window.AudioContext||window.webkitAudioContext)(),g=c.createGain();g.connect(c.destination);[880,1175].forEach((f,i)=>{const o=c.createOscillator(),t=c.currentTime+i*.2;o.frequency.value=f;o.connect(g);g.gain.setValueAtTime(.3,t);o.start(t);o.stop(t+.15);});}catch(e){}}

// Un "ticket" es lo que cocina tiene que preparar: un pedido de caja, o UNA ronda de una mesa (solo lo nuevo)
const prevRondas=c=>D.comandas.filter(x=>x.cuenta===c.cuenta&&x.ronda<c.ronda&&x.estado!=="cancelled").map(x=>`${x.items.filter(i=>!i.cancelado).map(i=>i.q+"× "+i.n).join(", ")} (${ESTADOS[x.estado]})`).join(" · ");
function ticketsCocina(){
  const hoy=hoyT(),T=[],vivo=e=>!["delivered","cancelled"].includes(e);
  ORDENES.forEach(o=>{if(!o.cuenta&&vivo(o.estado))T.push({k:"o:"+o.id,fecha:o.fecha,tit:"#"+o.id,sub:tipoT(o),hora:o.hora||"",estado:o.estado,items:o.items||[],nota:o.nota});});
  D.comandas.forEach(c=>{if(vivo(c.estado))T.push({k:"c:"+c.id,fecha:c.fecha,tit:"Mesa "+c.mesa,sub:c.nombre,mesero:c.mesero,ronda:c.ronda,hora:c.hora,estado:c.estado,items:c.items,nota:"",prev:prevRondas(c)});});
  return T.filter(t=>minDesde(t)<=1080).sort((a,b)=>((a.fecha||"")+a.hora).localeCompare((b.fecha||"")+b.hora));   // solo lo de las últimas 18 horas
}
// Productos que le tocan a la estación elegida (según las categorías asignadas a cada impresora)
const itemsT=t=>S.ks==="todas"?t.items:(ruta({items:t.items})[S.ks]||[]);
const getT=k=>{const[t,id]=k.split(":");return t==="o"?ORDENES.find(o=>o.id==id):D.comandas.find(c=>c.id==id);};

function vCocina(){
  const hoy=hoyT(),L=ticketsCocina().map(t=>({t,it:itemsT(t)})).filter(x=>x.it.length);
  const col=(titulo,estados,boton)=>{
    const R=L.filter(x=>estados.includes(x.t.estado));
    return `<section class="kcol"><h2>${titulo} <span class="badge">${R.length}</span></h2>`+(R.map(({t,it})=>{
      const m=minDesde(t),c=m>=20?"late":m>=10?"warn":"";
      return `<article class="kcard ${c}"><header><b>${esc(t.tit)}</b><span>${esc(t.sub)}</span><span class="kt">${m} min</span></header>`
      +(t.ronda?`<p class="kmeta">Mesero: ${esc(t.mesero||"-")} · Ronda ${t.ronda}</p>`:"")
      +(t.ronda>1?`<p class="kextra">➕ AGREGADO · RONDA ${t.ronda}: preparar SOLO lo de abajo</p>`:"")
      +(t.prev?`<p class="kprev">Ya enviado antes: ${esc(t.prev)}</p>`:"")
      +`<ul>${it.map(i=>i.cancelado?`<li class="kcanc"><s>${i.q}× ${esc(i.n)}</s> CANCELADO</li>`:`<li><b>${i.q}×</b> ${esc(i.n)}${notaItem(i)?` <span class="kinota">— ${esc(notaItem(i))}</span>`:""}</li>`).join("")}</ul>`
      +(t.nota?`<p class="knota">⚠ ${esc(t.nota)}</p>`:"")
      +`<footer><div class="kfila">${KANT[t.estado]?`<button class="kb kb--gris" data-act="co-ant" data-k="${t.k}" aria-label="Regresar">↩</button>`:""}<button class="kb" data-act="co-sig" data-k="${t.k}">${boton}</button></div>`
      +`<div class="kfila"><button class="kb kb--chico" data-act="co-av" data-k="${t.k}">💬 Avisar</button><button class="kb kb--chico kb--rojo" data-act="co-can" data-k="${t.k}">✖ Cancelar</button></div></footer></article>`;}).join("")||`<p class="kvacio">Sin pedidos</p>`)+`</section>`;
  };
  const pend=L.filter(x=>x.t.estado==="pending").length;
  if(S.ultPend!==null&&pend>S.ultPend&&S.son)beep();
  S.ultPend=pend;
  const sts=[["todas","Todas"],...D.imp.map(p=>[p.n,p.n]),["Sin impresora (caja)","Sin impresora"]],sl=sinLeer();

/* ---- Pestaña "Hoy" ---- */
function dnHoy(){

  const serie=Array.from({length:7},(_,i)=>{const d=new Date();d.setDate(d.getDate()-(6-i));return{etiqueta:d.toLocaleDateString("es-MX",{weekday:"short"}).replace(".",""),valor:Math.round(sumT(delDia(aTexto(d))))};});
  const sem=ventasDe(ORDENES.filter(o=>o.fecha>=fechaMas(-6)&&o.fecha<=hoy));
  const mes={};V.forEach(o=>{const k=o.mesero?"Mesero "+o.mesero:"Caja";mes[k]=mes[k]||{n:0,t:0};mes[k].n++;mes[k].t+=o.total;});

  +`<article class="tarjeta grafica"><h2>Últimos 7 días</h2>${cols(serie)}<p class="nota">Ventas por día (pesos).</p></article>`
  +`<article class="tarjeta"><h2>Lo más vendido</h2><p class="nota" style="margin:0 0 6px">Hoy</p>${barrasH(topProductos(V))}<p class="nota" style="margin:12px 0 6px">Últimos 7 días</p>${barrasH(topProductos(sem))}</article>`
  +`<article class="tarjeta"><h2>Resumen del día por mesero</h2>`+(Object.keys(mes).length?Object.entries(mes).map(([k,v])=>`<div class="dn-fila"><b style="flex:1">${esc(k)}</b><span>${v.n} pedidos</span><b>${moneda.format(v.t)}</b></div>`).join(""):vacio("Sin ventas hoy"))+`</article>`;

/* ---- Pestaña "Historial" ---- */
function filtraHist(){
  const N=S.dn,base=new Date();base.setHours(0,0,0,0);let L=ORDENES.slice();
  if(N.per!=="todo"){const lim=new Date(base);lim.setDate(lim.getDate()-(+N.per-1));L=L.filter(o=>aFecha(o.fecha)>=lim);}
  if(N.est==="entregados")L=L.filter(o=>o.estado==="delivered");
  else if(N.est==="cancelados")L=L.filter(o=>o.estado==="cancelled");
  else if(N.est==="curso")L=L.filter(o=>!["delivered","cancelled"].includes(o.estado));
  if(N.met!=="todos")L=L.filter(o=>o.metodo===N.met);
  if(N.mes!=="todos")L=L.filter(o=>(o.mesero||"Caja")===N.mes);
  const q=N.q.trim().toLowerCase();
  if(q)L=L.filter(o=>("#"+o.id+" "+tipoT(o)+" "+(o.nombreMesa||"")+" "+nomCli(o.cliente)+" "+(o.items||[]).map(i=>i.n+" "+notaItem(i)).join(" ")).toLowerCase().includes(q));
  return L.sort((a,b)=>(b.fecha+(b.hora||"")).localeCompare(a.fecha+(a.hora||""))||b.id-a.id);
}
function dnDetalle(o){

// Reduce la foto elegida (máx. 420 px, JPG) para que ocupe poco y se guarde dentro del panel
function reducirImagen(file,max,cb){
  const r=new FileReader();
  r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);cb(c.toDataURL("image/jpeg",.78));};im.src=r.result;};
  r.readAsDataURL(file);
}

// Si se abre el panel en otra pestaña o ventana del mismo navegador, los cambios llegan solos
// Recibe los cambios que otra ventana guardó. Llegan por el aviso instantáneo del navegador y, por si ese aviso no llega
// (pasa, por ejemplo, al abrir el archivo directamente o con la ventana en segundo plano), también se revisa cada segundo.
function recibirCambios(nuevo){
  try{
    const antes=D.chat.length,antesC=Object.fromEntries(D.comandas.map(c=>[c.id,c.estado]));
    D=normalizar(JSON.parse(nuevo));ultimoGuardado=nuevo;ORDENES.splice(0,ORDENES.length,...D.ordenes);D.ordenes=ORDENES;
    const m=D.chat.slice(antes).filter(x=>x.de!==quien());
    if(m.length){const u=m[m.length-1];toast(`💬 ${u.de}: ${u.t}`);beep();}
    // al mesero le avisa cuando una de SUS rondas ya está lista
    if(location.hash==="#meseros")D.comandas.filter(c=>c.estado==="ready"&&antesC[c.id]!=="ready"&&c.mesero===nombreMesero()).forEach(c=>{toast(`🍣 Mesa ${c.mesa}: ronda ${c.ronda} lista para llevar`);beep();});
    render();
  }catch(x){}
}
window.addEventListener("storage",e=>{if(e.key===KEY&&e.newValue&&e.newValue!==ultimoGuardado)recibirCambios(e.newValue);});
setInterval(()=>{const v=lsGet(KEY);if(v&&v!==ultimoGuardado)recibirCambios(v);},1000);

 "dn-ver":b=>{S.dn.ver=String(S.dn.ver)===b.dataset.id?null:b.dataset.id;},
 "dn-crear":()=>{(async()=>{
   const u=$("dn-user").value.trim(),p1=$("dn-p1").value,p2=$("dn-p2").value;
   if(!u)return toast("Escribe tu nombre.");if(p1.length<6)return toast("La contraseña debe tener al menos 6 caracteres.");if(p1!==p2)return toast("Las contraseñas no coinciden.");
   const sal=nuevaSal(),alg=hayCripto()?"s2":"f1";
   lsSet(K_CRED,JSON.stringify({u,sal,alg,h:await huella(p1,sal,alg),creado:hoyT()}));iniciarSesion();log("Acceso del dueño creado");guardar();render();})();return false;},
 "dn-entrar":()=>{(async()=>{await entrarDueno($("dn-pass").value);const e=$("dn-pass");if(e)e.value="";render();})();return false;},
 "dn-salir":()=>{ssSet(K_SES,null);S.dn.cuenta=false;},
 "dn-cuenta":()=>{S.dn.cuenta=!S.dn.cuenta;},
 "dn-cambiar":()=>{(async()=>{
   const c=credencial(),a=$("dn-pa").value,n=$("dn-pn").value,n2=$("dn-pn2").value;
   let ok=false;try{ok=(await huella(a,c.sal,c.alg))===c.h;}catch(e){}
   if(!ok)return toast("La contraseña actual no es correcta.");if(n.length<6)return toast("La nueva contraseña debe tener al menos 6 caracteres.");if(n!==n2)return toast("Las contraseñas nuevas no coinciden.");
   const sal=nuevaSal(),alg=hayCripto()?"s2":"f1";c.sal=sal;c.alg=alg;c.h=await huella(n,sal,alg);lsSet(K_CRED,JSON.stringify(c));S.dn.cuenta=false;toast("Contraseña cambiada");render();})();return false;},
 "dn-reset":()=>{if(!confirm("¿Restablecer el acceso del dueño en este aparato? Tendrá que crear una contraseña nueva."))return false;lsSet(K_CRED,"");ssSet(K_SES,null);lsSet(K_INT,"{}");toast("Acceso restablecido. Al abrir la app del dueño se pedirá crear uno nuevo.");},
 "dn-mas":()=>{S.dn.lim+=60;},
 "dn-csv":()=>{
   const f=[["Pedido","Fecha","Hora","Tipo","Nombre de la mesa","Cliente","Mesero","Pago","Estado","Total","Productos","Motivo de cancelación"],
     ...filtraHist().map(o=>[o.id,o.fecha,o.hora||"",tipoT(o),o.nombreMesa||"",nomCli(o.cliente),o.mesero||"Caja",(METODOS[o.metodo]||{nombre:o.metodo}).nombre,ESTADOS[o.estado],o.total,(o.items||[]).map(i=>i.q+"x "+i.n+(notaItem(i)?" ("+notaItem(i)+")":"")).join("; "),o.motivo||""])];
   descargar("historial-pedidos-"+hoyT()+".csv",aCSV(f),"text/csv;charset=utf-8");return false;}
});
document.addEventListener("input",e=>{if(e.target.id==="dn-q"){S.dn.q=e.target.value;S.dn.lim=60;render();}});
document.addEventListener("change",e=>{const t=e.target;if(t.id==="dn-met"){S.dn.met=t.value;render();}else if(t.id==="dn-mes"){S.dn.mes=t.value;render();}});
document.addEventListener("keydown",e=>{if(e.key!=="Enter")return;if(e.target.id==="dn-pass")A["dn-entrar"]();else if(e.target.id==="dn-p2")A["dn-crear"]();});

/* Genera el archivo "menú para clientes" con el menú actual del panel (platillos, opciones, fotos, club y datos del negocio).
   No incluye clientes, ventas ni nada interno. */
Object.assign(A,{
 "menu-cliente":()=>{
   if(typeof PLANTILLA_MENU_CLIENTES==="undefined"){toast("Esta función está en el archivo único (sushi-puuk.html).");return false;}
   const menu=D.menu.map(c=>({e:c.e,n:c.n,p:c.p.filter(p=>p.on&&p.c>0)})).filter(c=>c.p.length);
   const n=menu.reduce((s,c)=>s+c.p.length,0);
   if(!n){toast("No hay productos con precio y disponibles para publicar.");return false;}
   const raw={generado:new Date().toLocaleString("es-MX"),neg:{...D.neg},menu,mods:D.mods,prog:D.prog,dis:D.dis,recomp:D.recomp.filter(r=>r.activa)};
   const html=PLANTILLA_MENU_CLIENTES.replace("/*DATOS_MENU*/null",()=>JSON.stringify(raw).replace(/</g,"\\u003c"));
   descargar("menu-clientes.html",html,"text/html;charset=utf-8");
   toast(`Menú para clientes generado: ${n} productos en ${menu.length} categorías`);return false;}
});

/* Acciones del panel: opciones de platillos, pedidos con línea de tiempo, recompensas, editor de menú y datos del negocio */
Object.assign(A,{
 /* ---- opciones al agregar un producto (caja y meseros) ---- */
 "opc-ok":()=>{const{G,cb}=S.opc;const opc=[];let ex=0;
   G.forEach((g,gi)=>{const r=document.querySelector(`#opc-body input[name="g${gi}"]:checked`);if(r&&r.value!==""){const o=g.o[+r.value];opc.push(o.n);ex+=o.p||0;}});
   $("dlg-opc").close();S.opc=null;cb(opc,ex);return false;},
 "opc-no":()=>{$("dlg-opc").close();S.opc=null;return false;},
 "caja-add":b=>{const p=D.menu.flatMap(c=>c.p).find(p=>p.n===b.dataset.n);
   pedirOpciones(p,(opc,ex)=>{const k=opc.join("|"),it=S.caja.items.find(i=>i.n===p.n&&!i.nota&&(i.opc||[]).join("|")===k);if(it)it.q++;else S.caja.items.push({n:p.n,c:p.c+ex,q:1,nota:"",opc});render();guardar();});return false;},
 "mz-add":b=>{const p=D.menu.flatMap(c=>c.p).find(p=>p.n===b.dataset.n);
   pedirOpciones(p,(opc,ex)=>{agregarBorrador(cuenta(S.m.id),p,opc,ex);render();guardar();});return false;},
 /* ---- pedidos ---- */
 "ped-abrir":b=>{S.pedAb=String(S.pedAb)===b.dataset.id?null:b.dataset.id;},
 "ped-set":b=>{
   const o=ORDENES.find(o=>o.id==b.dataset.id),e=b.dataset.e;if(!o||["delivered","cancelled"].includes(o.estado))return false;
   if(e==="cancelled"){const m=prompt("Motivo de la cancelación (puedes dejarlo vacío):");if(m===null)return false;o.estado="cancelled";o.motivo=m.trim();o.por=quien();decir(quien(),`🚫 Pedido #${o.id} cancelado${o.motivo?": "+o.motivo:""}`,true);}
   else if(e==="delivered")completar(o);else o.estado=e;
   o.te=o.te||{};o.te[o.estado]=Date.now();log(`Pedido #${o.id}: ${ESTADOS[o.estado]}`);},
 "ped-imp":b=>{const o=ORDENES.find(o=>o.id==b.dataset.id);imprimirTxt(comanda(o).replace(/\n\n/g,"\n\n\f\n"));return false;},
 /* ---- recompensas ---- */
 "rec-nueva":()=>{S.rf=true;S.re=null;S.rimg=null;},
 "rec-edit":b=>{S.rf=true;S.re=b.dataset.id;S.rimg=null;},
 "rec-cerrar":()=>{S.rf=false;S.re=null;S.rimg=null;},
 "rec-guardar":()=>{
   const n=$("r-n").value.trim(),c=+$("r-c").value;if(!n||!(c>0)){toast("Escribe el nombre y los sellos requeridos.");return false;}
   const base={n,tipo:$("r-tipo").value,costo:c,limite:Math.max(0,Math.round(+$("r-lim").value||0)),desc:$("r-desc").value.trim(),reset:$("r-reset").checked,activa:$("r-act").checked};
   const e=D.recomp.find(r=>r.id===S.re);
   if(e){const antes=e.n;Object.assign(e,base);if(S.rimg)e.img=S.rimg;if(antes!==e.n)D.canjes.forEach(x=>{if(x.r===antes)x.r=e.n;});}
   else D.recomp.push({id:"r"+Date.now().toString(36),...base,img:S.rimg||""});
   S.rf=false;S.re=null;S.rimg=null;toast("Recompensa guardada");},
 "rec-act":b=>{const r=D.recomp.find(x=>x.id===b.dataset.id);r.activa=!r.activa;},
 "rec-del":b=>{if(!confirm("¿Eliminar esta recompensa?"))return false;D.recomp=D.recomp.filter(x=>x.id!==b.dataset.id);},
 "l-canje":b=>{const r=D.recomp[+b.dataset.r],c=cli(S.lc);
   if(!r||!c||!puedeCanjear(c,r)){toast("Todavía no puede canjear esta recompensa.");return false;}
   c.bal=r.reset&&D.prog.tipo==="sellos"?0:+(c.bal-r.costo).toFixed(2);D.canjes.unshift({f:hoyT(),c:c.id,r:r.n});log(`${c.n} canjeó ${r.n}`);toast("Canje registrado: entrega "+r.n);},
 /* ---- editor de menú ---- */
 "plato-nuevo":()=>{S.platoImg="";["pl-n","pl-c","pl-d"].forEach(i=>{$(i).value="";});$("pl-promo").checked=false;$("pl-prev").innerHTML="";
   $("pl-cat").innerHTML=D.menu.map((c,i)=>`<option value="${i}">${esc(c.e)} ${esc(c.n)}</option>`).join("");$("dlg-plato").showModal();return false;},
 "plato-no":()=>{$("dlg-plato").close();return false;},
 "plato-ok":()=>{
   const n=$("pl-n").value.trim(),c=+$("pl-c").value;if(!n){toast("Escribe el nombre del platillo.");return false;}if(!(c>0)){toast("Escribe un precio mayor a 0.");return false;}
   const cat=D.menu[+$("pl-cat").value];cat.p.unshift({n,c,d:$("pl-d").value.trim(),img:S.platoImg||"",r:"",on:true,m:[],promo:$("pl-promo").checked});cat.t=Math.max(cat.t,cat.p.length);cat.cerr=false;
   $("dlg-plato").close();toast(`"${n}" agregado a ${cat.n}.`);},
 "mod-add":()=>{const n=prompt("Nombre del grupo de opciones (ej. Tipo de rollo):");if(n){D.mods.unshift({n,k:0,o:[],req:false});S.mo=0;}},
 "mod-opt":b=>{const i=+b.dataset.i,n=$("mo-"+i).value.trim();S.mo=i;if(!n)return;D.mods[i].o.push({n,p:Math.max(0,parseFloat($("mp-"+i).value)||0)});$("mo-"+i).value="";$("mp-"+i).value="";},
 "opt-del":b=>{S.mo=+b.dataset.i;D.mods[+b.dataset.i].o.splice(+b.dataset.o,1);},
 "mod-del":b=>{const g=D.mods[+b.dataset.i];if(!confirm(`¿Eliminar el grupo "${g.n}"?`))return false;D.menu.forEach(c=>c.p.forEach(p=>{p.m=p.m.filter(x=>x!==g.n);}));D.mods.splice(+b.dataset.i,1);S.mo=null;},
 /* ---- datos del negocio ---- */
 "neg-save":()=>{const v=id=>$(id).value.trim();Object.assign(D.neg,{n:v("n-n"),sucursal:v("n-suc"),lema:v("n-lema"),tel:v("n-tel"),dir:v("n-dir"),hor:v("n-hor"),maps:v("n-maps"),fb:v("n-fb"),ig:v("n-ig"),tt:v("n-tt")});toast("Datos del negocio guardados");}
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.plimg){reducirImagen(t.files[0],420,u=>{S.platoImg=u;$("pl-prev").innerHTML=`<img src="${u}" style="width:56px;height:56px;border-radius:10px;object-fit:cover" alt="">`;});}
  else if(t.dataset.rimg){reducirImagen(t.files[0],160,u=>{S.rimg=u;render();});}
  else if(t.dataset.mover){const[c,p]=t.dataset.mover.split("-").map(Number),[it]=D.menu[c].p.splice(p,1);D.menu[+t.value].p.unshift(it);render();guardar();}
  else if(t.dataset.greq!==undefined){D.mods[+t.dataset.greq].req=t.checked;guardar();}
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.te){const o=ORDENES.find(x=>x.id==t.dataset.te);if(o){o.tiempoEst=Math.max(1,Math.round(+t.value)||30);guardar();}}
  else if(t.dataset.gn!==undefined){const g=D.mods[+t.dataset.gn],old=g.n;g.n=t.value;D.menu.forEach(c=>c.p.forEach(p=>{p.m=p.m.map(x=>x===old?t.value:x);}));guardar();}
  else if(t.dataset.on!==undefined){const[i,o]=t.dataset.on.split("-").map(Number);D.mods[i].o[o].n=t.value;guardar();}
  else if(t.dataset.op!==undefined){const[i,o]=t.dataset.op.split("-").map(Number);D.mods[i].o[o].p=Math.max(0,parseFloat(t.value)||0);guardar();}
});

</script>
</body>
